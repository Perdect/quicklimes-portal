<script data-theme-boot>/* THEME BOOT — runs before the FIRST PAINT. The app shell applies the theme at
   mount, which is far too late: the browser would paint the page light and then
   flip, so a Light user on a dark Mac sees a white flash. Must stay in <head>,
   above every stylesheet. (It used to guard the launch splash; the splash is
   gone, the flash it prevents is not.) Resolves 'system' here too, so data-theme
   is ALWAYS a literal light|dark and CSS never has to ask twice. */
(function(){try{var t=localStorage.getItem('ql_theme')||'light';
var d=t==='dark'||(t!=='light'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches);
document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){}})();</script>

<style>
  /* App Health — an engineering board, so it deliberately looks calmer than the
     business pages: no tints competing for attention, severity carried by one
     dot and one border. Everything uses app tokens so it themes with the rest. */
  .hb-tally { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: var(--ql-space-4); }
  .hb-pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 999px;
    border: 1px solid var(--ql-border); background: var(--ql-card);
    font: 600 12.5px var(--ql-font-sans); color: var(--ql-text-secondary); font-variant-numeric: tabular-nums; }
  .hb-pill b { color: var(--ql-text); font-weight: 800; }
  .hb-dot { width: 8px; height: 8px; border-radius: 99px; flex: none; }
  .hb-dot.high { background: var(--ql-danger-600, #dc2626); }
  .hb-dot.med  { background: #b45309; }
  .hb-dot.low  { background: var(--ql-text-muted); }
  .hb-dot.fixed { background: #15803d; }
  .hb-dot.await { background: #6d28d9; }

  .hb-note { border: 1px solid var(--ql-border); background: var(--ql-bg); border-radius: var(--ql-radius-lg);
    padding: 13px 15px; font: 500 12.5px/1.6 var(--ql-font-sans); color: var(--ql-text-secondary); margin-bottom: var(--ql-space-4); }
  .hb-note b { color: var(--ql-text); }

  .hb-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: var(--ql-space-5); }
  .hb-stat { background: var(--ql-card); border: 1px solid var(--ql-border); border-radius: var(--ql-radius-xl); padding: 15px 17px; }
  .hb-stat .n { font: 800 32px/1 var(--ql-font-sans); letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: var(--ql-text); }
  .hb-stat .l { font: 700 10.5px var(--ql-font-sans); text-transform: uppercase; letter-spacing: .07em; color: var(--ql-text-secondary); margin-top: 7px; }
  .hb-stat.red .n { color: var(--ql-danger-600, #dc2626); }
  .hb-stat.green .n { color: #15803d; }
  .hb-stat.amber .n { color: #b45309; }
  .hb-stat.violet .n { color: #6d28d9; }
  :root[data-theme="dark"] .hb-stat.green .n { color: #4ade80; }
  :root[data-theme="dark"] .hb-stat.amber .n { color: #fbbf24; }
  :root[data-theme="dark"] .hb-stat.violet .n { color: #a78bfa; }
  :root[data-theme="dark"] .hb-dot.med { background: #fbbf24; }
  :root[data-theme="dark"] .hb-dot.fixed { background: #4ade80; }
  :root[data-theme="dark"] .hb-dot.await { background: #a78bfa; }

  .hb-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: var(--ql-space-3); }
  .hb-tab { font: 600 12.5px var(--ql-font-sans); color: var(--ql-text-secondary); background: var(--ql-card);
    border: 1px solid var(--ql-border); border-radius: 999px; padding: 7px 14px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px; }
  .hb-tab.active { background: var(--ql-text); color: var(--ql-bg-elevated); border-color: var(--ql-text); }
  .hb-tab .n { font-size: 11px; opacity: .75; }

  .hb-list { display: flex; flex-direction: column; gap: 8px; }
  .hb-item { background: var(--ql-card); border: 1px solid var(--ql-border); border-left: 4px solid var(--ql-border);
    border-radius: var(--ql-radius-lg); overflow: hidden; }
  .hb-item.high  { border-left-color: var(--ql-danger-600, #dc2626); }
  .hb-item.med   { border-left-color: #b45309; }
  .hb-item.low   { border-left-color: var(--ql-text-muted); }
  .hb-item.fixed { border-left-color: #15803d; }
  .hb-item.await { border-left-color: #6d28d9; }
  .hb-sum { display: flex; align-items: baseline; gap: 10px; padding: 12px 15px; cursor: pointer; list-style: none; }
  .hb-sum::-webkit-details-marker { display: none; }
  .hb-sum:focus-visible { outline: 2px solid var(--ql-brand-500, #2563eb); outline-offset: -2px; }
  .hb-t { font: 700 13.5px var(--ql-font-sans); color: var(--ql-text); }
  .hb-mod { margin-left: auto; flex: none; font: 700 10.5px var(--ql-font-sans); text-transform: uppercase;
    letter-spacing: .05em; color: var(--ql-text-muted); }
  .hb-body { padding: 0 15px 14px 29px; font: 500 13px/1.6 var(--ql-font-sans); color: var(--ql-text-secondary); }
  .hb-body p { margin: 0 0 8px; max-width: 68ch; }
  .hb-body b { color: var(--ql-text); }
  .hb-body code { font: 12px var(--ql-font-mono, ui-monospace, Menlo, monospace); background: var(--ql-bg);
    border: 1px solid var(--ql-border); border-radius: 5px; padding: 1px 6px; }
  .hb-verdict { font: 700 11px var(--ql-font-sans); text-transform: uppercase; letter-spacing: .05em;
    padding: 2px 8px; border-radius: 999px; border: 1px solid var(--ql-border); color: var(--ql-text-secondary); }
  .hb-empty { padding: 48px 20px; text-align: center; color: var(--ql-text-secondary); }
  .hb-denied { max-width: 560px; margin: 60px auto; text-align: center; color: var(--ql-text-secondary); }
  @media (max-width: 760px) { .hb-sum { flex-wrap: wrap; } .hb-mod { margin-left: 0; width: 100%; } }

<script>
/* The app's shared header (QLX.heroHTML) — the same one the registers render.
   This page's logic lives in an external file, so the header is mounted here
   rather than threaded through it. */
(function () {
  const go = () => {
    const host = document.getElementById('hbHero');
    if (!host || host.dataset.on) return;
    /* The header is chrome. If qlx.js failed to load, this page's own content
       must still render — so say so loudly and carry on, rather than taking
       the page down with the decoration. */
    if (!window.QLX || !QLX.heroHTML) { console.warn('QLX not loaded — shared page header skipped'); return; }
    host.dataset.on = '1';
    const cfg = { title: 'App Health', sub: '<span id="hbSub">Every module audited, every confirmed issue — and what today\'s code actually says.</span>', tools: [] };
    host.innerHTML = QLX.heroHTML(cfg);
    QLX.wireHero(host, cfg);
  };
  /* MOUNT SYNCHRONOUSLY. This waited for DOMContentLoaded, but QLD.init(render)
     fires render() during script execution when the data is already cached —
     BEFORE that event. render() then wrote to elements the header had not
     created yet ($('#bkSub').textContent on a null), threw, and aborted before
     filling the page body. The header looked perfect and everything under it
     was missing. This script sits below its host in the document, so the host
     already exists; the listener stays as a fallback and go() is idempotent. */
  go();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go);
})();
</script>
