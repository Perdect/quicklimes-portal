<script data-theme-boot>/* THEME BOOT — runs before the FIRST PAINT. The app shell applies the theme at
   mount, which is far too late: the browser would paint the page light and then
   flip, so a Light user on a dark Mac sees a white flash. Must stay in <head>,
   above every stylesheet. (It used to guard the launch splash; the splash is
   gone, the flash it prevents is not.) Resolves 'system' here too, so data-theme
   is ALWAYS a literal light|dark and CSS never has to ask twice. */
(function(){try{var t=localStorage.getItem('ql_theme')||'light';
var d=t==='dark'||(t!=='light'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches);
document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){}})();</script>

  @media (max-width: 640px) { .ai-ex { grid-template-columns: 1fr; } .ai-hero h1 { font-size: 22px; } }

<body class="ql-v2">
<div id="ql-page">

        <div class="ai-inp">
          <input id="aiInput" placeholder="e.g. How much petcoke did we buy in June?" autocomplete="off">
          <button id="aiSend" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
        </div>
      </div>
      <div class="ai-ex" id="aiExamples"></div>
      <div class="ai-conv" id="qlAiLog"></div>
    </div>
  </div>
</div>

<script>
QLShell.mount({ active: 'ai', title: 'AI Assistant' });
const $ = s => document.querySelector(s);
const esc = s => (s == null ? '' : s).toString().replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Example queries straight from the business spec — tap to run.
const EXAMPLES = [
  ['🔥', 'How much petcoke did we buy in June?'],
  ['📥', 'Which suppliers are pending above ₹5 lakh?'],
  ['⏰', 'Show invoices unpaid more than 30 days'],
  ['🏦', 'Match unmatched bank entries'],
  ['📈', 'Average petcoke price this month'],
  ['🏆', 'Top 10 suppliers'],
  ['🧾', 'How much GST paid?'],
  ['💰', 'What is pending payment today?']
];
let started = false;

function renderExamples() {
  $('#aiExamples').innerHTML = EXAMPLES.map(([ic, q]) =>
    `<button data-q="${esc(q)}"><span class="ic">${ic}</span><span>${esc(q)}</span></button>`).join('');
  document.querySelectorAll('#aiExamples button').forEach(b => b.onclick = () => ask(b.dataset.q));
}

const log = [];
function paint() {
  $('#qlAiLog').innerHTML = log.map(m => `<div class="ql-ai-msg ${m.who}">${m.html}</div>`).join('');
  const l = $('#qlAiLog'); window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}
function ask(q) {
  q = (q || '').trim(); if (!q) return;
  if (!started) { started = true; $('#aiHero').style.display = 'none'; $('#aiExamples').style.display = 'none'; }
  log.push({ who: 'me', html: esc(q) });
  let ans; try { ans = QLShell.assistAnswer(q); } catch (e) { ans = '<p>Sorry, I hit a snag answering that. Try rephrasing?</p>'; }
  log.push({ who: 'ai', html: ans });
  if (log.length > 60) log.splice(0, log.length - 60);
  paint();
}
$('#aiSend').onclick = () => { const i = $('#aiInput'); ask(i.value); i.value = ''; };
$('#aiInput').addEventListener('keydown', e => { if (e.key === 'Enter') { ask(e.target.value); e.target.value = ''; } });

function boot() {
  $('#aiSub').textContent = 'Real answers from ' + (QLD.co ? QLD.co.short : 'your business') + '’s invoices, payments and bank data — nothing made up.';
  renderExamples();
}
window.__qlOnSwitchCompany = () => boot();
window.__qlRefresh = boot;
QLD.init(boot);
</script>
