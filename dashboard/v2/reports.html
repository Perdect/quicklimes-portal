<script>
/* The app's shared header (QLX.heroHTML) — the same one the registers render. */
(function mountHero() {
  const go = () => {
    const host = document.getElementById('rhHero');
    if (!host || host.dataset.on) return;
    /* The header is chrome. If qlx.js failed to load, this page's own content
       must still render — so say so loudly and carry on, rather than taking
       the page down with the decoration. */
    if (!window.QLX || !QLX.heroHTML) { console.warn('QLX not loaded — shared page header skipped'); return; }
    host.dataset.on = '1';
    const cfg = { title: 'Reports Hub', sub: '<span id="rhSub">Generate · distribute · schedule — no manual file sharing</span>', tools: [] };
    host.innerHTML = QLX.heroHTML(cfg);
    QLX.wireHero(host, cfg);
  };
  /* MOUNT SYNCHRONOUSLY. This waited for DOMContentLoaded, but QLD.init(render)
     fires render() during script execution when the data is already cached —
     BEFORE that event. render() then wrote to elements the header had not
     created yet ($('#bkSub').textContent on a null), threw, and aborted before
     filling the page body. The header looked perfect and everything under it
     was missing. This script sits below its host in the document, so the host
     already exists; the listener stays as a fallback and go() is idempotent. */
  go();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go);
})();

QLShell.mount({ active: 'reports', title: 'Reports Hub' });

/* ═══════════════════════════════════════════════════════════════
   Reports Hub. EVERY number on this page comes out of QLD (data.js).
   Nothing is hard-coded, nothing is invented: a KPI is whatever
   buildReport() returns, and a trend is only ever drawn when the
   PREVIOUS period genuinely has data to compare against.
   ═══════════════════════════════════════════════════════════════ */

let tab = 'generate', selType = 'sales';
let range = 'month';        // seeded; pickRange() replaces it on first paint
let rangeAuto = true;       // until the user clicks a pill
let typeQ = '', navCollapsed = false;
let sortCol = null, sortDir = 1;
let custom = { from: '', to: '' };
let selGroups = null;       // lazily seeded from the groups that actually have members

/* ── icons (inline SVG — the app's svg()/IC convention) ────────── */
const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  sales:        '<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>',
  purchase:     '<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>',
  collections:  '<circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/>',
  outstanding:  '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/>',
  pl:           '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
  gst:          '<line x1="3" y1="21" x2="21" y2="21"/><line x1="4" y1="10" x2="4" y2="21"/><line x1="20" y1="10" x2="20" y2="21"/><line x1="9" y1="10" x2="9" y2="21"/><line x1="15" y1="10" x2="15" y2="21"/><polygon points="12 2 21 8 3 8"/>',
  production:   '<path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4H2z"/>',
  topcustomers: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
  topsuppliers: '<rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>',
  cashflow:     '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/>',
  refunds:      '<polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>',
  search:       '<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  collapse:     '<polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/>',
  expand:       '<polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/>',
  pdf:          '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="15"/><line x1="9" y1="18" x2="13" y2="18"/>',
  excel:        '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  print:        '<polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
  send:         '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
  clock:        '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/>',
  info:         '<circle cx="12" cy="12" r="9"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>',
  up:           '<line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>',
  down:         '<line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/>',
  flat:         '<line x1="5" y1="12" x2="19" y2="12"/>',
  eye:          '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
  trash:        '<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>',
  plus:         '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'
};
const typeIcon = t => I[t.id] ? svg(I[t.id]) : `<span>${t.icon}</span>`;

/* ── ranges ───────────────────────────────────────────────────────
   Local Y-M-D (NOT toISOString — that shifts to UTC and breaks month
   edges in IST). Every boundary is built from the local calendar.   */
const isoOf = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const spanOf = (a, b) => ({ from: isoOf(a), to: isoOf(b) });
const clampDay = (y, m, d) => new Date(y, m, Math.min(d, new Date(y, m+1, 0).getDate()));
const weekStart = now => new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay()+6)%7));   // Monday

function ranges() {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  return {
    today:   { label: 'Today',        from: isoOf(now),                          to: isoOf(now) },
    yday:    { label: 'Yesterday',    from: isoOf(new Date(y, m, d-1)),          to: isoOf(new Date(y, m, d-1)) },
    week:    { label: 'This Week',    from: isoOf(weekStart(now)),               to: isoOf(now) },
    month:   { label: 'This Month',   from: isoOf(new Date(y, m, 1)),            to: isoOf(now) },
    lastmon: { label: 'Last Month',   from: isoOf(new Date(y, m-1, 1)),          to: isoOf(new Date(y, m, 0)) },
    quarter: { label: 'Quarter',      from: isoOf(new Date(y, Math.floor(m/3)*3, 1)), to: isoOf(now) },
    year:    { label: 'Year',         from: isoOf(new Date(y, 0, 1)),            to: isoOf(now) },
    all:     { label: 'All time',     from: null,                                to: null },
    custom:  { label: 'Custom Range', from: custom.from || null,                 to: custom.to || null }
  };
}
function curRange(){ return ranges()[range] || ranges().month; }

/* The period immediately BEFORE the current one, matched for length so a
   month-to-date compares against the same days of last month (never a
   partial month against a full one). `all` has no predecessor → null. */
function prevRange(key) {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  const parse = s => { const [a,b,c] = String(s).split('-').map(Number); return new Date(a, b-1, c); };
  const days = (a, b) => Math.round((b - a) / 86400000);
  switch (key) {
    case 'today':   return spanOf(new Date(y, m, d-1), new Date(y, m, d-1));
    case 'yday':    return spanOf(new Date(y, m, d-2), new Date(y, m, d-2));
    case 'week': {
      const ws = weekStart(now), el = days(ws, new Date(y, m, d));
      const ps = new Date(ws.getFullYear(), ws.getMonth(), ws.getDate()-7);
      return spanOf(ps, new Date(ps.getFullYear(), ps.getMonth(), ps.getDate()+el));
    }
    case 'month':   return spanOf(new Date(y, m-1, 1), clampDay(y, m-1, d));
    case 'lastmon': return spanOf(new Date(y, m-2, 1), new Date(y, m-1, 0));
    case 'quarter': {
      const qs = Math.floor(m/3)*3, cs = new Date(y, qs, 1), el = days(cs, new Date(y, m, d));
      const ps = new Date(y, qs-3, 1);
      return spanOf(ps, new Date(ps.getFullYear(), ps.getMonth(), ps.getDate()+el));
    }
    case 'year':    return spanOf(new Date(y-1, 0, 1), clampDay(y-1, m, d));
    case 'custom': {
      if (!custom.from || !custom.to) return null;
      const fd = parse(custom.from), td = parse(custom.to), len = days(fd, td);
      const pe = new Date(fd.getFullYear(), fd.getMonth(), fd.getDate()-1);
      return spanOf(new Date(pe.getFullYear(), pe.getMonth(), pe.getDate()-len), pe);
    }
    default: return null;      // 'all'
  }
}

/* Reports whose numbers actually move with from/to. The rest
   (collections, outstanding, production, refunds) are point-in-time
   snapshots inside data.js — comparing them across periods would
   invent a trend out of identical numbers, so we never do. */
const RANGE_AWARE = { sales: 1, purchase: 1, pl: 1, gst: 1, topcustomers: 1, topsuppliers: 1, cashflow: 1 };

/* Real activity in a window — the only honest basis for "has data". */
function activityIn(from, to) {
  return QLD.buildReport('sales', from, to).count
       + QLD.buildReport('purchase', from, to).count
       + QLD.buildReport('cashflow', from, to).count;
}
function rangeActivity(k) { const r = ranges()[k]; return (k === 'custom' && !custom.from) ? 0 : activityIn(r.from, r.to); }
/* Fix for the "opens on an empty view" bug: the firm's books can end weeks
   ago, so land on the most recent period that HAS data instead of a month
   of zeros. Never fabricates rows — it only chooses where to look. */
const FALLBACK = ['month', 'lastmon', 'quarter', 'year', 'all'];
function pickRange() { for (const k of FALLBACK) if (rangeActivity(k)) return k; return 'month'; }
function nearestWithData() { for (const k of FALLBACK) if (k !== range && rangeActivity(k)) return k; return null; }

/* ── formatting ───────────────────────────────────────────────── */
function money(n){ return '₹' + QLD.fmt(n); }
function fmtCell(v){ return (typeof v === 'number' && Math.abs(v) >= 1000) ? money(v) : (v==null||v==='' ? '—' : v); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const pillCls = v => { const s = String(v||'').toLowerCase();
  return /overdue/.test(s) ? 'bad'
       : /paid|cash|received|credited/.test(s) ? 'ok'
       : /pending|partial|due|unpaid|claimed|filed|processing/.test(s) ? 'warn'
       : 'mut'; };   // cancelled / voided / anything else → grey
function statusPill(v){ return `<span class="rp-pill ${pillCls(v)}">${esc(v||'—')}</span>`; }
function periodLabel(r){ return r && r.from ? `${QLD.fDS(r.from)} – ${QLD.fDS(r.to)}` : 'all time'; }
window.__view = idx => QLShell.printInvoice(+idx);

/* ── trends: computed, or absent ──────────────────────────────────
   A KPI value is either a number (counts) or a data.js-formatted
   currency string. Anything else (a customer NAME, a tonnage) has no
   comparable magnitude → no trend. No previous data, or a zero base
   → no trend. We would rather show nothing than a made-up arrow. */
function kpiNum(v) {
  if (typeof v === 'number') return isFinite(v) ? v : null;
  const m = /^₹\s*(-?[\d,]+(?:\.\d+)?)/.exec(String(v));
  return m ? parseFloat(m[1].replace(/,/g, '')) : null;
}
const UP_GOOD = /sales|revenue|profit|collected|received|money in|balance|retention|dispatch/i;
const UP_BAD  = /cost|payable|overdue|to pay|money out/i;
function trendCls(label, pct) {
  if (Math.round(pct) === 0) return 'flat';
  const good = UP_GOOD.test(label) ? pct > 0 : UP_BAD.test(label) ? pct < 0 : null;
  return good === null ? 'flat' : good ? 'up' : 'down';   // unknown polarity → neutral, never a fake verdict
}
function kpiTrends(rep) {
  const none = rep.kpis.map(() => null);
  if (!RANGE_AWARE[selType]) return none;
  const pr = prevRange(range);
  if (!pr) return none;
  const prev = QLD.buildReport(selType, pr.from, pr.to);
  return rep.kpis.map((k, i) => {
    const pk = prev.kpis[i];
    if (!pk || pk[0] !== k[0]) return null;             // labels must line up
    const now = kpiNum(k[1]), was = kpiNum(pk[1]);
    if (now == null || was == null || was === 0) return null;   // no comparable base → no trend
    return { pct: (now - was) / Math.abs(was) * 100, was: pk[1], when: periodLabel(pr) };
  });
}
function trendBadge(t, label) {
  if (!t) return '';
  const cls = trendCls(label, t.pct);
  const dir = Math.round(t.pct) === 0 ? 'flat' : t.pct > 0 ? 'up' : 'down';
  const n = Math.abs(t.pct);
  return `<span class="rx-trend ${cls}">${svg(I[dir])}${n < 10 ? n.toFixed(1) : Math.round(n)}%</span>`;
}
const KPI_TINT = l => /overdue|to pay|payable/i.test(l) ? 't-red'
                    : /pending|to collect|net gst/i.test(l) ? 't-amber'
                    : /profit|received|money in|retention|collected/i.test(l) ? 't-green'
                    : /top|customers|suppliers/i.test(l) ? 't-slate' : '';

/* ── inline SVG charts (no library — same approach as dashboard.js) ── */
const C1 = 'var(--ql-brand-600)', CSER = ['var(--ql-brand-600)','var(--ql-success-500)','var(--ql-warning-500)','var(--ql-danger-500)','var(--ql-brand-300)','var(--ql-neutral-400)'];
const chartCard = (t, s, inner) => `<div class="rx-chart rx-fade"><div class="rx-chart-h"><span class="rx-chart-t">${esc(t)}</span><span class="rx-chart-s">${esc(s)}</span></div>${inner}</div>`;
const shortMoney = n => Math.abs(n) >= 100000 ? QLD.fL(n) : money(n);

function lineChart(pts) {
  const W = 520, H = 170, L = 10, R = 10, T = 10, B = 22;
  const vals = pts.map(p => p.v), max = Math.max(...vals, 0), min = Math.min(...vals, 0), span = (max - min) || 1;
  const x = i => L + (pts.length < 2 ? (W-L-R)/2 : i * (W-L-R) / (pts.length-1));
  const y = v => T + (1 - (v - min) / span) * (H-T-B);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
  const area = `${d} L${x(pts.length-1).toFixed(1)} ${y(min).toFixed(1)} L${x(0).toFixed(1)} ${y(min).toFixed(1)} Z`;
  const grid = [0, .5, 1].map(f => `<line class="rx-gl" x1="${L}" x2="${W-R}" y1="${(T + f*(H-T-B)).toFixed(1)}" y2="${(T + f*(H-T-B)).toFixed(1)}"/>`).join('');
  const dots = pts.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="2.6" style="fill:${C1}"><title>${esc(p.l)}: ${esc(shortMoney(p.v))}</title></circle>`).join('');
  const step = Math.ceil(pts.length / 6);
  const lab = pts.map((p, i) => (i % step === 0 || i === pts.length-1) ? `<text class="rx-ax" x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle">${esc(p.l)}</text>` : '').join('');
  return `<svg viewBox="0 0 ${W} ${H}">${grid}<path d="${area}" style="fill:${C1}" opacity=".10"/><path d="${d}" style="stroke:${C1}" fill="none" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${dots}${lab}</svg>`;
}
function barChart(items) {
  const W = 520, H = 170, L = 10, R = 10, T = 10, B = 22;
  const hi = Math.max(...items.map(i => i.v), 0), lo = Math.min(...items.map(i => i.v), 0), span = (hi - lo) || 1;
  const yOf = v => T + (1 - (v - lo) / span) * (H-T-B);
  const zero = yOf(0);
  const bw = (W-L-R) / items.length, pad = Math.min(12, bw * .3);
  const bars = items.map((it, i) => {
    const yv = yOf(it.v), up = it.v >= 0;
    const by = up ? yv : zero, h = Math.max(1, Math.abs(yv - zero));
    return `<rect x="${(L + i*bw + pad/2).toFixed(1)}" y="${by.toFixed(1)}" width="${(bw-pad).toFixed(1)}" height="${h.toFixed(1)}" rx="3" style="fill:${up ? C1 : 'var(--ql-danger-500)'}"><title>${esc(it.l)}: ${esc(it.f || shortMoney(it.v))}</title></rect>`;
  }).join('');
  const step = Math.ceil(items.length / 7);
  const lab = items.map((it, i) => (i % step === 0) ? `<text class="rx-ax" x="${(L + i*bw + bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${esc(String(it.l).slice(0, 9))}</text>` : '').join('');
  return `<svg viewBox="0 0 ${W} ${H}"><line class="rx-gl" x1="${L}" x2="${W-R}" y1="${zero.toFixed(1)}" y2="${zero.toFixed(1)}"/>${bars}${lab}</svg>`;
}
function donut(items) {
  const tot = items.reduce((a, i) => a + i.v, 0) || 1, R = 52, r = 33, cx = 60, cy = 60;
  let a0 = -Math.PI/2;
  const arcs = items.map((it, i) => {
    const a1 = a0 + it.v / tot * Math.PI*2, big = (a1-a0) > Math.PI ? 1 : 0;
    const p = (rad, a) => `${(cx + rad*Math.cos(a)).toFixed(2)} ${(cy + rad*Math.sin(a)).toFixed(2)}`;
    const d = items.length === 1
      ? `M ${cx} ${cy-R} A ${R} ${R} 0 1 1 ${cx-0.01} ${cy-R} L ${cx-0.01} ${cy-r} A ${r} ${r} 0 1 0 ${cx} ${cy-r} Z`
      : `M ${p(R,a0)} A ${R} ${R} 0 ${big} 1 ${p(R,a1)} L ${p(r,a1)} A ${r} ${r} 0 ${big} 0 ${p(r,a0)} Z`;
    a0 = a1;
    return `<path d="${d}" style="fill:${CSER[i % CSER.length]}"><title>${esc(it.l)}: ${it.v}</title></path>`;
  }).join('');
  const legend = items.map((it, i) => `<span class="rx-lg"><i style="background:${CSER[i % CSER.length]}"></i>${esc(it.l)} <b>${it.v}</b></span>`).join('');
  return `<svg viewBox="0 0 120 120" style="max-width:150px;margin:0 auto">${arcs}<text x="60" y="58" text-anchor="middle" style="font-size:19px;font-weight:800;fill:var(--ql-text)">${tot}</text><text x="60" y="72" text-anchor="middle" class="rx-ax">rows</text></svg><div class="rx-legend">${legend}</div>`;
}
function hbars(items) {
  const max = Math.max(...items.map(i => i.v), 0) || 1;
  return `<div class="rx-hbars">${items.map(it => `
    <div><div class="rx-hbar-l"><span>${esc(it.l)}</span><b>${esc(shortMoney(it.v))}</b></div>
    <div class="rx-hbar-t"><div class="rx-hbar-f" style="width:${(it.v/max*100).toFixed(1)}%"></div></div></div>`).join('')}</div>`;
}

/* Charts are chosen from the report's OWN columns. If the data behind a
   chart isn't there (no date column, one data point, no status), the chart
   is not drawn — it is never padded out. */
function chartsFor(rep) {
  const H = rep.headers.map(h => String(h).toLowerCase()), out = [];
  const numeric = i => i >= 0 && rep.rows.some(r => typeof r[i] === 'number');
  const dIdx = H.indexOf('date');
  const amtIdx = ['total', 'amount', 'taxable', 'outstanding'].map(n => H.indexOf(n)).find(i => numeric(i));
  const stIdx = H.findIndex(h => h === 'status');
  const nameIdx = H.findIndex(h => /^(party|customer|supplier)$/.test(h));
  const amtName = amtIdx >= 0 ? rep.headers[amtIdx] : '';

  // Line/Amount ledger-style reports (P&L, GST summary) → a bar of the real lines
  if (rep.headers.length === 2 && /^(line|particulars)$/.test(H[0]) && H[1] === 'amount' && rep.rows.length) {
    const items = rep.rows.map(r => ({ l: String(r[0]).replace(/^Less: /, ''), v: +r[1] || 0 }));
    if (items.some(i => i.v)) out.push(chartCard(rep.title, 'every line, as filed', barChart(items)));
  }
  // Month-series reports (Production / Dispatch)
  if (H[0] === 'month' && numeric(1) && rep.rows.length > 1) {
    out.push(chartCard(rep.headers[1] + ' by month', rep.rows.length + ' months',
      barChart(rep.rows.map(r => ({ l: String(r[0]), v: +r[1] || 0, f: QLD.fmt(r[1], 1) })))));
  }
  if (dIdx >= 0 && amtIdx >= 0 && rep.rows.length) {
    const byDay = {}, byMon = {};
    rep.rows.forEach(r => { const d = r[dIdx], v = +r[amtIdx] || 0; if (!d) return; byDay[d] = (byDay[d]||0) + v; byMon[String(d).slice(0,7)] = (byMon[String(d).slice(0,7)]||0) + v; });
    const days = Object.keys(byDay).sort(), mons = Object.keys(byMon).sort();
    if (days.length > 1)
      out.push(chartCard(amtName + ' trend', days.length + ' days', lineChart(days.map(d => ({ l: QLD.fDS(d), v: byDay[d] })))));
    if (mons.length > 1)
      out.push(chartCard('Monthly ' + amtName.toLowerCase(), mons.length + ' months',
        barChart(mons.map(m => ({ l: QLD.fDS(m + '-01').split(' ')[1] || m, v: byMon[m] })))));
  }
  if (stIdx >= 0 && rep.rows.length) {
    const by = {}; rep.rows.forEach(r => { const s = r[stIdx] || 'unknown'; by[s] = (by[s]||0) + 1; });
    out.push(chartCard(rep.headers[stIdx] + ' mix', rep.count + ' rows', donut(Object.entries(by).map(([l, v]) => ({ l, v })))));
  }
  if (nameIdx >= 0 && amtIdx >= 0 && rep.rows.length > 1) {
    const by = {}; rep.rows.forEach(r => { by[r[nameIdx]] = (by[r[nameIdx]]||0) + (+r[amtIdx] || 0); });
    const list = Object.entries(by).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([l, v]) => ({ l, v }));
    if (list.length > 1) out.push(chartCard('Top ' + rep.headers[nameIdx].toLowerCase() + 's by ' + amtName.toLowerCase(), 'top ' + list.length, hbars(list)));
  }
  return out.join('');
}

function csvReport(rep) {
  const q = c => `"${String(c==null?'':c).replace(/"/g,'""')}"`;
  const lines = [rep.headers.join(','), ...rep.rows.map(r => r.map(q).join(',')), rep.totals ? rep.totals.map(q).join(',') : ''].filter(Boolean);
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\n')], {type:'text/csv;charset=utf-8'}));
  a.download = `${rep.id}_${QLD.co.short}_${range}.csv`.replace(/\s+/g,'_'); a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function reportSummaryMsg(rep) {
  const lines = rep.kpis.map(k => `• ${k[0]}: ${k[1]}`).join('\n');
  // Clean text header (no leading emoji — wa.me / mailto clients can mangle it to �).
  return `*${rep.title}* — ${QLD.co.short}\nPeriod: ${rep.period}\n${lines}\n\n(Full report attached — generated from QuickLimes.)`;
}
function sendToGroup(groupId) {
  const rep = QLD.buildReport(selType, curRange().from, curRange().to);
  const g = QLD.getGroups().find(x => x.id === groupId);
  if (!g || !g.members.length) { QLShell.toast('Add members to ' + (g?g.name:'this group') + ' first'); tab='groups'; render(); return; }
  csvReport(rep);                       // download the file to attach
  const msg = reportSummaryMsg(rep);
  g.members.forEach(mem => {
    if (mem.channel === 'email') window.open(`mailto:${mem.value}?subject=${encodeURIComponent(rep.title+' — '+QLD.co.short)}&body=${encodeURIComponent(msg)}`, '_blank');
    else { let p = (mem.value||'').replace(/\D/g,''); if (p.length===10) p='91'+p; window.open(`https://wa.me/${p}?text=${encodeURIComponent(msg)}`, '_blank'); }
  });
  QLShell.toast(`Report downloaded · opened ${g.members.length} message${g.members.length>1?'s':''}`);
}
function sendSelected() {
  if (!selGroups || !selGroups.length) { QLShell.toast('Pick a recipient group first'); return; }
  selGroups.slice().forEach(sendToGroup);
}

/* ── Generate tab ─────────────────────────────────────────────── */
function genTab() {
  const rs = ranges(), cur = curRange();
  const rep = QLD.buildReport(selType, cur.from, cur.to);
  const isSnap = !RANGE_AWARE[selType];
  const empty = rep.rows.length === 0 || (!isSnap && rangeActivity(range) === 0);

  /* left nav */
  const q = typeQ.trim().toLowerCase();
  const types = QLD.REPORT_TYPES.filter(t => !q || t.name.toLowerCase().includes(q));
  const nav = types.length
    ? types.map(t => `<button class="rx-nav-item ${t.id===selType?'on':''}" title="${esc(t.name)}" onclick="__type('${t.id}')">${typeIcon(t)}<b>${esc(t.name)}</b></button>`).join('')
    : `<div class="rx-nav-empty">No report matches “${esc(typeQ)}”.</div>`;

  /* range pills */
  const pills = Object.keys(rs).map(k => `<button class="rx-pill ${k===range?'on':''}" onclick="__range('${k}')">${esc(rs[k].label)}</button>`).join('');
  const customBar = range === 'custom' ? `<div class="rx-custom"><span>From</span><input type="date" value="${esc(custom.from)}" onchange="__custom('from',this.value)"><span>To</span><input type="date" value="${esc(custom.to)}" onchange="__custom('to',this.value)">${custom.from&&custom.to?'':'<span>Pick both dates to build the report.</span>'}</div>` : '';

  /* KPI cards — values straight from buildReport, trends only when real */
  const tr = kpiTrends(rep);
  const kpis = rep.kpis.map((k, i) => {
    const t = tr[i];
    return `<div class="rx-kpi rx-fade ${KPI_TINT(k[0])}">
      <div class="rx-kpi-top"><span class="rx-kpi-ic">${typeIcon(QLD.REPORT_TYPES.find(x=>x.id===selType)||{id:selType,icon:''})}</span>${trendBadge(t, k[0])}</div>
      <div class="rx-kpi-l">${esc(k[0])}</div>
      <div class="rx-kpi-v">${esc(String(k[1]))}</div>
      ${t ? `<div class="rx-kpi-c">vs ${esc(String(t.was))} · ${esc(t.when)}</div>` : ''}
    </div>`;
  }).join('');

  /* table */
  const numCol = rep.headers.map((h,ci)=>rep.rows.some(r=>typeof r[ci]==='number'));
  const statusIdx = rep.headers.findIndex(h=>/^status$/i.test(h));
  const isSales = selType === 'sales';
  const invMap = {}; if (isSales) QLD.salesRows().forEach(r => { invMap[r.inv] = r.idx; });
  const cell = (c,i)=> i===statusIdx ? `<td>${statusPill(c)}</td>`
      : `<td class="${(numCol[i]?'num':'')}${i===0?' inv':''}${/gstin/i.test(rep.headers[i])?' mut':''}">${fmtCell(c)}</td>`;
  const CAP = 60;
  const rows = sortedRows(rep);
  const ar = i => sortCol === i ? `<span class="rx-sort-ar">${sortDir>0?'↑':'↓'}</span>` : '';
  const th = rep.headers.map((h,i)=>`<th class="rx-sortable ${numCol[i]?'num':''} ${sortCol===i?'rx-sorted':''}" onclick="__sort(${i})">${esc(h)}${ar(i)}</th>`).join('') + (isSales?'<th></th>':'');
  const body = rows.slice(0,CAP).map(r => {
      const act = isSales && invMap[r[0]]!=null ? `<td><button class="rp-act" title="View invoice" onclick="__view(${invMap[r[0]]})">${svg(I.eye)}</button></td>` : (isSales?'<td></td>':'');
      return '<tr>'+r.map((c,i)=>cell(c,i)).join('')+act+'</tr>';
    }).join('');
  const tot = rep.totals ? '<tr class="rp-tot">'+rep.totals.map((c,i)=>`<td class="${numCol[i]?'num':''}">${fmtCell(c)}</td>`).join('')+(isSales?'<td></td>':'')+'</tr>' : '';

  /* mobile invoice cards (sales) */
  const gIdx = rep.headers.findIndex(h=>/gstin/i.test(h)), vIdx = rep.headers.findIndex(h=>/vehicle/i.test(h)),
        qIdx = rep.headers.findIndex(h=>/qty/i.test(h)), totIdx = rep.headers.findIndex(h=>/total/i.test(h)), dIdx = 1;
  const mcards = isSales ? rows.slice(0,CAP).map(r=>`
      <div class="rp-mcard" ${invMap[r[0]]!=null?`onclick="__view(${invMap[r[0]]})"`:''}>
        <div class="rp-mcard-top"><span class="rp-mcard-inv">${esc(r[0])}</span>${statusIdx>=0?statusPill(r[statusIdx]):''}</div>
        <div class="rp-mcard-sub">${esc(r[2])}${gIdx>=0&&r[gIdx]&&r[gIdx]!=='—'?' · '+esc(r[gIdx]):''}</div>
        <div class="rp-mcard-rows">
          <div class="rp-mcard-r"><span>Date</span><b>${esc(r[dIdx])}</b></div>
          ${vIdx>=0?`<div class="rp-mcard-r"><span>Vehicle</span><b>${esc(r[vIdx])}</b></div>`:''}
          ${qIdx>=0?`<div class="rp-mcard-r"><span>Qty</span><b>${fmtCell(r[qIdx])} T</b></div>`:''}
          ${totIdx>=0?`<div class="rp-mcard-r"><span>Total</span><b>${fmtCell(r[totIdx])}</b></div>`:''}
        </div>
      </div>`).join('') : '';

  /* recipients */
  const groups = QLD.getGroups();
  const chips = groups.map(g => `<button class="rx-chip ${selGroups.includes(g.id)?'on':''}" onclick="__chip('${g.id}')"><i></i>${esc(g.name)}<em>${g.members.length}</em></button>`).join('');

  const meta = QLD.REPORT_TYPES.find(t => t.id === selType) || { name: selType, id: selType, icon: '' };
  const head = `<div class="rx-head">
      <div class="rx-head-t"><span class="rx-head-ic">${typeIcon(meta)}</span>
        <div><h2>${esc(rep.title)}</h2><div class="rx-head-sub">${esc(rep.period)} · ${rep.count} row${rep.count===1?'':'s'}</div></div></div>
      <div class="rx-acts">
        <button class="ql-btn ql-btn-secondary" onclick="__p()">${svg(I.pdf)} PDF</button>
        <button class="ql-btn ql-btn-secondary" onclick="__x()">${svg(I.excel)} Excel</button>
        <button class="ql-btn ql-btn-secondary" onclick="window.print()">${svg(I.print)} Print</button>
      </div></div>`;
  const snapNote = isSnap ? `<div class="rx-snap">${svg(I.info)} This report is a live snapshot of what is open right now — the date range does not apply to it, so no period comparison is shown.</div>` : '';

  return `
    <div class="rx-grid ${navCollapsed?'rx-collapsed':''}">
      <div class="rx-nav">
        <div class="rx-nav-head"><span class="rx-nav-h">Reports</span>
          <button class="rx-collapse" title="${navCollapsed?'Expand':'Collapse'} list" onclick="__nav()">${svg(navCollapsed?I.expand:I.collapse)}</button></div>
        <div class="rx-search">${svg(I.search)}<input id="rxQ" type="search" placeholder="Search reports" value="${esc(typeQ)}" oninput="__q(this.value)"></div>
        <div class="rx-nav-list">${nav}</div>
      </div>
      <div class="rh-preview">
        <div class="rx-bar"><div class="rx-seg">${pills}</div></div>
        ${customBar}
        ${head}
        ${snapNote}
        ${empty ? emptyState(rep) : `
          <div class="rx-kpis">${kpis}</div>
          <div class="rx-charts">${chartsFor(rep)}</div>
          <div class="rp-table-wrap rx-fade"><div class="rp-scroll"><table class="rp-table"><thead><tr>${th}</tr></thead><tbody>${body}${tot}</tbody></table></div></div>
          ${mcards?`<div class="rp-mcards">${mcards}</div>`:''}
          ${rep.rows.length>CAP?`<div class="rp-note">Showing ${CAP} of ${rep.count} — the full set is in the PDF / Excel.</div>`:''}`}
        <div class="rx-foot">
          <span class="rx-foot-h">Send to</span>
          <div class="rx-chips">${chips}</div>
          <div class="rx-foot-btns">
            <button class="ql-btn ql-btn-primary" onclick="sendSelected()">${svg(I.send)} Send Report</button>
            <button class="ql-btn ql-btn-secondary" onclick="addSchedule()">${svg(I.clock)} Schedule Report</button>
          </div>
        </div>
      </div>
    </div>`;
}
function sortedRows(rep) {
  if (sortCol == null || sortCol >= rep.headers.length) return rep.rows;
  return rep.rows.slice().sort((a, b) => {
    const x = a[sortCol], y = b[sortCol];
    if (typeof x === 'number' && typeof y === 'number') return (x - y) * sortDir;
    return String(x==null?'':x).localeCompare(String(y==null?'':y)) * sortDir;
  });
}

function groupsTab() {
  const groups = QLD.getGroups();
  return `<div class="rh-groups">${groups.map(g => `
    <div class="card" style="gap:var(--ql-space-3)">
      <div class="card-head"><div class="card-title">${g.name}</div><button class="ql-btn ql-btn-primary" onclick="addMember('${g.id}')">${svg(I.plus)} Member</button></div>
      ${g.members.length ? g.members.map((m,i)=>`<div class="rh-member"><div><b>${esc(m.name)}</b><div class="page-sub">${m.channel==='email'?'✉️ '+esc(m.value):'📱 '+esc(m.value)}</div></div><button class="sr-kebab" onclick="delMember('${g.id}',${i})"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${I.trash}</svg></button></div>`).join('') : '<div class="page-sub">No members yet — add your CA / partners / team.</div>'}
    </div>`).join('')}</div>`;
}
function schedTab() {
  const sch = QLD.getSchedules(), groups = QLD.getGroups();
  const gName = id => (groups.find(g=>g.id===id)||{}).name || id;
  return `<div style="display:flex;flex-direction:column;gap:var(--ql-space-3)">
    <div class="ql-modal-note">⏱️ Scheduled reports appear as a reminder in your 🔔 notifications when due — tap to generate &amp; send in one go. (Fully-automatic background sending needs the server add-on.)</div>
    <button class="ql-btn ql-btn-primary" style="align-self:flex-start" onclick="addSchedule()">${svg(I.plus)} Schedule a report</button>
    ${sch.length ? sch.map((s,i)=>`<div class="rh-member"><div><b>${(QLD.REPORT_TYPES.find(t=>t.id===s.type)||{}).name||s.type}</b> · ${s.freq} → ${gName(s.group)}<div class="page-sub">Next due ${s.nextDue?QLD.fDS(s.nextDue):'—'}</div></div><button class="sr-kebab" onclick="delSchedule(${i})"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${I.trash}</svg></button></div>`).join('') : '<div class="page-sub">No scheduled reports yet.</div>'}
  </div>`;
}

function render() {
  if (rangeAuto) { range = pickRange(); rangeAuto = false; }        // land where the data actually is
  if (selGroups === null) selGroups = QLD.getGroups().filter(g => g.members.length).map(g => g.id);
  document.getElementById('rhSub').textContent = `${QLD.co.short} · ${QLD.REPORT_TYPES.length} report types · ${QLD.getGroups().reduce((a,g)=>a+g.members.length,0)} recipients`;
  document.querySelectorAll('#rhTabs .sr-tab').forEach(t=>t.classList.toggle('active', t.dataset.t===tab));
  document.getElementById('rhBody').innerHTML = tab==='generate'?genTab():tab==='groups'?groupsTab():schedTab();
  // expose current-report export closures for the inline buttons
  window.__p = () => printReport(QLD.buildReport(selType, curRange().from, curRange().to));
  window.__x = () => csvReport(QLD.buildReport(selType, curRange().from, curRange().to));
  QLShell.paintWorkspace();
}

/* ── UI actions ───────────────────────────────────────────────── */
window.__type   = id => { selType = id; sortCol = null; render(); };
window.__range  = k  => { range = k; rangeAuto = false; render(); };
window.__custom = (k, v) => { custom[k] = v; range = 'custom'; rangeAuto = false; render(); };
window.__nav    = () => { navCollapsed = !navCollapsed; render(); };
window.__chip   = id => { const i = selGroups.indexOf(id); i < 0 ? selGroups.push(id) : selGroups.splice(i, 1); render(); };
window.__sort   = i  => { if (sortCol === i) sortDir = -sortDir; else { sortCol = i; sortDir = 1; } render(); };
window.__q      = v  => { typeQ = v; render(); const el = document.getElementById('rxQ'); if (el && el.focus) { el.focus(); if (el.setSelectionRange) try { el.setSelectionRange(v.length, v.length); } catch (_) {} } };
window.sendSelected = sendSelected;
window.sendToGroup = sendToGroup;

window.addMember = (gid) => QLShell.formPrompt('Add recipient', [
    {k:'name',label:'Name',req:true,full:true},
    {k:'channel',label:'Channel',type:'select',opts:[['whatsapp','WhatsApp'],['email','Email']]},
    {k:'value',label:'Phone or email',req:true,full:true}
  ], v => { const g=QLD.getGroups(); g.find(x=>x.id===gid).members.push({name:v.name,channel:v.channel,value:v.value}); QLD.saveGroups(g); selGroups=null; render(); });
window.delMember = (gid,i) => { const g=QLD.getGroups(); g.find(x=>x.id===gid).members.splice(i,1); QLD.saveGroups(g); render(); };
window.addSchedule = () => QLShell.formPrompt('Schedule a report', [
    {k:'type',label:'Report',type:'select',opts:QLD.REPORT_TYPES.map(t=>[t.id,t.name]),full:true},
    {k:'freq',label:'Frequency',type:'select',opts:['Daily','Weekly','Monthly','Quarterly','Yearly']},
    {k:'group',label:'Send to',type:'select',opts:QLD.getGroups().map(g=>[g.id,g.name])}
  ], v => { const s=QLD.getSchedules(); const d=new Date(); const next={Daily:1,Weekly:7,Monthly:30,Quarterly:91,Yearly:365}[v.freq]||30; d.setDate(d.getDate()+next); s.push({id:Date.now(),type:v.type,freq:v.freq,group:v.group,nextDue:isoOf(d)}); QLD.saveSchedules(s); render(); QLShell.toast('Report scheduled'); });
window.delSchedule = (i) => { const s=QLD.getSchedules(); s.splice(i,1); QLD.saveSchedules(s); render(); };

document.querySelectorAll('#rhTabs .sr-tab').forEach(t => t.addEventListener('click', () => { tab=t.dataset.t; render(); }));
window.__qlOnSwitchCompany = () => { rangeAuto = true; selGroups = null; render(); };   // shell owns the switch
window.__qlRefresh = render;
QLD.init(render);
</script>
</body>
</html>
