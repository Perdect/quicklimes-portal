<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reports Hub — QuickLimes v2</title>
<meta name="theme-color" content="#2563EB">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="manifest" href="/v2/app.webmanifest">
<link rel="apple-touch-icon" href="/v2/pwa-apple.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="QuickLimes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./tokens.css"><link rel="stylesheet" href="./shell.css"><link rel="stylesheet" href="./pages.css?v=m1"><link rel="stylesheet" href="./report.css?v=r1">
<script src="ql-api.js"></script>
<script src="./data.js?v=m11"></script>
<link rel="stylesheet" href="./mobile.css?v=m4">
</head>
<body class="ql-v2">
<div id="ql-page">
  <div class="dash">
    <div class="page-head">
      <div><h1 class="page-title">Reports Hub</h1><div class="page-sub" id="rhSub">Generate · distribute · schedule — no manual file sharing</div></div>
    </div>
    <div class="card" style="gap:var(--ql-space-4)">
      <div class="sr-toolbar">
        <div class="sr-tabs" id="rhTabs">
          <button class="sr-tab active" data-t="generate">Generate</button>
          <button class="sr-tab" data-t="groups">Distribution Groups</button>
          <button class="sr-tab" data-t="schedule">Scheduled</button>
        </div>
      </div>
      <div id="rhBody"></div>
    </div>
  </div>
</div>
<script src="./shell.js?v=m12"></script>
<script src="./mobile.js?v=m4"></script>
<script>
QLShell.mount({ active: 'reports', title: 'Reports Hub' });
let tab = 'generate', selType = 'sales', range = 'month';

function ranges() {
  // Local Y-M-D (NOT toISOString — that shifts to UTC and breaks month edges in IST)
  const now = new Date(), y = now.getFullYear(), m = now.getMonth(), iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const lm = new Date(y, m-1, 1);
  return {
    month:   { label: 'This month',  from: iso(new Date(y,m,1)),        to: iso(now) },
    lastmon: { label: 'Last month',  from: iso(lm),                     to: iso(new Date(y,m,0)) },
    quarter: { label: 'This quarter',from: iso(new Date(y, Math.floor(m/3)*3, 1)), to: iso(now) },
    year:    { label: 'This year',   from: iso(new Date(y,0,1)),        to: iso(now) },
    all:     { label: 'All time',    from: null,                        to: null }
  };
}
function curRange(){ return ranges()[range]; }
function money(n){ return '₹' + QLD.fmt(n); }
function fmtCell(v){ return (typeof v === 'number' && Math.abs(v) >= 1000) ? money(v) : (v==null||v==='' ? '—' : v); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function statusPill(v){ const s=String(v||'').toLowerCase(); const cls=/paid|cash|received/.test(s)?'ok':/pending|partial|overdue|due|unpaid/.test(s)?'warn':'mut'; return `<span class="rp-pill ${cls}">${esc(v||'—')}</span>`; }
window.__view = idx => QLShell.printInvoice(+idx);

/* ── PDF (print) + Excel (CSV) export ── */
function printReport(rep) {
  const co = QLD.co, w = window.open('', '_blank'); if (!w) { QLShell.toast('Allow pop-ups to download'); return; }
  const numCol = rep.headers.map((h,ci)=>rep.rows.some(r=>typeof r[ci]==='number'));
  const statusIdx = rep.headers.findIndex(h=>/^status$/i.test(h));
  const pill = v => { const s=String(v||'').toLowerCase(); const c=/paid|cash|received/.test(s)?'ok':/pending|partial|overdue|due|unpaid/.test(s)?'warn':'mut'; return `<span class="pill ${c}">${esc(v||'—')}</span>`; };
  const cell = (c,i)=> i===statusIdx ? `<td>${pill(c)}</td>` : `<td class="${numCol[i]?'r':''}${/gstin/i.test(rep.headers[i])?' mono':''}${i===0?' b':''}">${fmtCell(c)}</td>`;
  const th = rep.headers.map((h,i) => `<th class="${numCol[i]?'r':''}">${esc(h)}</th>`).join('');
  const tr = rep.rows.map(r => '<tr>' + r.map((c,i) => cell(c,i)).join('') + '</tr>').join('');
  const tot = rep.totals ? '<tr class="tot">' + rep.totals.map((c,i)=>`<td class="${numCol[i]?'r':''}">${fmtCell(c)}</td>`).join('') + '</tr>' : '';
  const kpis = rep.kpis.map(k => `<div class="k"><span>${k[0]}</span><b>${k[1]}</b></div>`).join('');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(rep.title)} — ${esc(co.short)}</title><style>
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:'Geist','Inter',Arial,sans-serif;padding:30px;color:#0f172a;font-size:12px;background:#f8fafc}
    .sheet{max-width:1100px;margin:0 auto;background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 12px 24px -8px rgba(15,23,42,.08);padding:26px 28px}
    .h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:1px solid #e2e8f0;padding-bottom:16px;margin-bottom:18px}
    .h .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(140deg,#3B82F6,#1D4ED8);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none}
    .h .t{display:flex;gap:13px;align-items:center}
    .h h1{font-size:20px;font-weight:800;letter-spacing:-.02em}.h .eyebrow{font-size:11px;font-weight:700;color:#2563EB;text-transform:uppercase;letter-spacing:.06em}
    .h .c{font-size:11px;color:#475569;text-align:right;line-height:1.7}.h .c b{color:#0f172a;font-size:13px}
    .meta{color:#64748b;margin-bottom:16px;font-size:11.5px}
    .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
    .k{border:1px solid #e2e8f0;border-radius:12px;padding:12px 14px;background:#fff}.k span{display:block;font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;font-weight:600}.k b{font-size:18px;font-weight:800;letter-spacing:-.02em}
    .twrap{border:1px solid #e2e8f0;border-radius:14px;overflow:hidden}
    table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
    th{background:#f8fafc;text-align:left;padding:11px 13px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#475569;font-weight:600;border-bottom:1px solid #e2e8f0}
    td{padding:10px 13px;border-bottom:1px solid #f1f5f9}tr:last-child td{border-bottom:none}
    .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.b{font-weight:700;color:#2563EB}.mono{font-family:'Geist Mono',monospace;font-size:11px;color:#64748b}
    tbody tr:nth-child(even) td{background:#fcfdfe}
    .tot td{font-weight:800;border-top:2px solid #cbd5e1;background:#f8fafc}
    .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:10.5px;font-weight:700}
    .pill:before{content:"";width:6px;height:6px;border-radius:99px;background:currentColor}
    .pill.ok{background:#DCFCE7;color:#15803D}.pill.warn{background:#FEF3C7;color:#B45309}.pill.mut{background:#F1F5F9;color:#475569}
    .bar{max-width:1100px;margin:0 auto 14px;display:flex;gap:8px;justify-content:flex-end}.btn{padding:9px 18px;border:none;border-radius:9px;font-weight:600;cursor:pointer;font-family:inherit;font-size:13px}.bp{background:#2563EB;color:#fff}.bs{background:#e2e8f0;color:#0f172a}
    @media print{.bar{display:none}body{padding:0;background:#fff}.sheet{border:none;box-shadow:none;border-radius:0;max-width:none;padding:0}th{background:#eee!important;-webkit-print-color-adjust:exact}.pill{-webkit-print-color-adjust:exact}}
  </style></head><body>
    <div class="bar"><button class="btn bp" onclick="window.print()">🖨️ Print / Save PDF</button><button class="btn bs" onclick="window.close()">Close</button></div>
    <div class="sheet">
      <div class="h">
        <div class="t"><div class="logo">${esc((co.short||'Q').charAt(0).toUpperCase())}</div><div><div class="eyebrow">${esc(rep.title)}</div><h1>${esc(co.name)}</h1></div></div>
        <div class="c"><b>${co.gstin?'GSTIN '+esc(co.gstin):esc(co.name)}</b><br>${esc(co.address||'')}</div>
      </div>
      <div class="meta">Period: <b>${esc(rep.period)}</b> · ${rep.count} rows · generated ${new Date().toLocaleDateString('en-IN')}</div>
      <div class="kpis">${kpis}</div>
      <div class="twrap"><table><thead><tr>${th}</tr></thead><tbody>${tr}${tot}</tbody></table></div>
    </div>
  </body></html>`);
  w.document.close();
}
function csvReport(rep) {
  const esc = c => `"${String(c==null?'':c).replace(/"/g,'""')}"`;
  const lines = [rep.headers.join(','), ...rep.rows.map(r => r.map(esc).join(',')), rep.totals ? rep.totals.map(esc).join(',') : ''].filter(Boolean);
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\n')], {type:'text/csv;charset=utf-8'}));
  a.download = `${rep.id}_${QLD.co.short}_${range}.csv`.replace(/\s+/g,'_'); a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function reportSummaryMsg(rep) {
  const lines = rep.kpis.map(k => `• ${k[0]}: ${k[1]}`).join('\n');
  return `${rep.icon||''} ${rep.title} — ${QLD.co.short}\nPeriod: ${rep.period}\n${lines}\n\n(Full report attached — generated from QuickLimes.)`;
}
function sendToGroup(groupId) {
  const rep = QLD.buildReport(selType, curRange().from, curRange().to);
  const g = QLD.getGroups().find(x => x.id === groupId);
  if (!g || !g.members.length) { QLShell.toast('Add members to ' + (g?g.name:'this group') + ' first'); tab='groups'; render(); return; }
  csvReport(rep);                       // download the file to attach
  const msg = reportSummaryMsg(rep);
  g.members.forEach(mem => {
    if (mem.channel === 'email') window.open(`mailto:${mem.value}?subject=${encodeURIComponent(rep.title+' — '+QLD.co.short)}&body=${encodeURIComponent(msg)}`, '_blank');
    else { let p = (mem.value||'').replace(/\D/g,''); if (p.length===10) p='91'+p; window.open(`https://wa.me/${p}?text=${encodeURIComponent(msg)}`, '_blank'); }
  });
  QLShell.toast(`Report downloaded · opened ${g.members.length} message${g.members.length>1?'s':''}`);
}

/* ── Tab renderers ── */
function genTab() {
  const rep = QLD.buildReport(selType, curRange().from, curRange().to);
  const rs = ranges();
  const typeCards = QLD.REPORT_TYPES.map(t => `<button class="rh-type ${t.id===selType?'on':''}" onclick="selType='${t.id}';render()"><span>${t.icon}</span>${t.name}</button>`).join('');
  const rangeBtns = Object.keys(rs).map(k => `<button class="sr-tab ${k===range?'active':''}" onclick="range='${k}';render()">${rs[k].label}</button>`).join('');
  const groupOpts = QLD.getGroups().map(g => `<button class="ql-btn ql-btn-secondary" onclick="sendToGroup('${g.id}')">Send to ${g.name}</button>`).join('');
  // modern data-driven table: numeric columns right-align, a "Status" column → pill
  const numCol = rep.headers.map((h,ci)=>rep.rows.some(r=>typeof r[ci]==='number'));
  const statusIdx = rep.headers.findIndex(h=>/^status$/i.test(h));
  const isSales = selType === 'sales';
  const invMap = {}; if(isSales) QLD.salesRows().forEach(r=>{ invMap[r.inv]=r.idx; });
  const eyeSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  const cell = (c,i)=> i===statusIdx ? `<td>${statusPill(c)}</td>`
      : `<td class="${(numCol[i]?'num':'')}${i===0?' inv':''}${/gstin/i.test(rep.headers[i])?' mut':''}">${fmtCell(c)}</td>`;
  const CAP = 60;
  const th = rep.headers.map((h,i)=>`<th class="${numCol[i]?'num':''}">${esc(h)}</th>`).join('') + (isSales?'<th></th>':'');
  const body = rep.rows.length ? rep.rows.slice(0,CAP).map(r=>{
      const act = isSales && invMap[r[0]]!=null ? `<td><button class="rp-act" title="View invoice" onclick="__view(${invMap[r[0]]})">${eyeSvg}</button></td>` : (isSales?'<td></td>':'');
      return '<tr>'+r.map((c,i)=>cell(c,i)).join('')+act+'</tr>';
    }).join('') : `<tr><td colspan="${rep.headers.length+(isSales?1:0)}"><div style="text-align:center;padding:44px;color:var(--ql-text-muted)">No data for this period</div></td></tr>`;
  const tot = rep.totals ? '<tr class="rp-tot">'+rep.totals.map((c,i)=>`<td class="${numCol[i]?'num':''}">${fmtCell(c)}</td>`).join('')+(isSales?'<td></td>':'')+'</tr>' : '';
  // mobile invoice cards (sales report)
  const gIdx = rep.headers.findIndex(h=>/gstin/i.test(h)), vIdx = rep.headers.findIndex(h=>/vehicle/i.test(h)),
        qIdx = rep.headers.findIndex(h=>/qty/i.test(h)), txIdx = rep.headers.findIndex(h=>/taxable/i.test(h)),
        gstIdx = rep.headers.findIndex(h=>/^gst$/i.test(h)), totIdx = rep.headers.findIndex(h=>/total/i.test(h)), dIdx=1;
  const mcards = isSales ? rep.rows.slice(0,CAP).map(r=>`
      <div class="rp-mcard" ${invMap[r[0]]!=null?`onclick="__view(${invMap[r[0]]})"`:''}>
        <div class="rp-mcard-top"><span class="rp-mcard-inv">${esc(r[0])}</span>${statusIdx>=0?statusPill(r[statusIdx]):''}</div>
        <div class="rp-mcard-sub">${esc(r[2])}${gIdx>=0&&r[gIdx]&&r[gIdx]!=='—'?' · '+esc(r[gIdx]):''}</div>
        <div class="rp-mcard-rows">
          <div class="rp-mcard-r"><span>Date</span><b>${esc(r[dIdx])}</b></div>
          ${vIdx>=0?`<div class="rp-mcard-r"><span>Vehicle</span><b>${esc(r[vIdx])}</b></div>`:''}
          ${qIdx>=0?`<div class="rp-mcard-r"><span>Qty</span><b>${fmtCell(r[qIdx])} T</b></div>`:''}
          ${totIdx>=0?`<div class="rp-mcard-r"><span>Total</span><b>${fmtCell(r[totIdx])}</b></div>`:''}
        </div>
      </div>`).join('') : '';
  return `
    <div class="rh-grid">
      <div class="rh-types">${typeCards}</div>
      <div class="rh-preview">
        <div class="sr-tabs" style="flex-wrap:wrap;margin-bottom:var(--ql-space-3)">${rangeBtns}</div>
        <div class="rh-prev-head"><div><div style="font-weight:800;font-size:var(--ql-text-lg)">${rep.icon} ${rep.title}</div><div class="page-sub">${rep.period} · ${rep.count} rows</div></div>
          <div class="page-actions"><button class="ql-btn ql-btn-secondary" onclick="__p()">📄 PDF</button><button class="ql-btn ql-btn-secondary" onclick="__x()">📊 Excel</button></div></div>
        <div class="rp-kpis" style="grid-template-columns:repeat(${Math.min(4,rep.kpis.length)},1fr)">${rep.kpis.map(k=>`<div class="rp-kpi"><div class="rp-kpi-l">${k[0]}</div><div class="rp-kpi-v">${k[1]}</div></div>`).join('')}</div>
        <div class="rp-table-wrap"><div class="rp-scroll"><table class="rp-table"><thead><tr>${th}</tr></thead><tbody>${body}${tot}</tbody></table></div></div>
        ${mcards?`<div class="rp-mcards">${mcards}</div>`:''}
        ${rep.rows.length>CAP?`<div class="rp-note">Showing ${CAP} of ${rep.count} — full set in the PDF / Excel.</div>`:''}
        <div class="rh-send"><span class="rh-send-h">📤 Send report:</span>${groupOpts}</div>
      </div>
    </div>`;
}
function groupsTab() {
  const groups = QLD.getGroups();
  return `<div class="rh-groups">${groups.map(g => `
    <div class="card" style="gap:var(--ql-space-3)">
      <div class="card-head"><div class="card-title">${g.name}</div><button class="ql-btn ql-btn-primary" onclick="addMember('${g.id}')">+ Member</button></div>
      ${g.members.length ? g.members.map((m,i)=>`<div class="rh-member"><div><b>${m.name}</b><div class="page-sub">${m.channel==='email'?'✉️ '+m.value:'📱 '+m.value}</div></div><button class="sr-kebab" onclick="delMember('${g.id}',${i})"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button></div>`).join('') : '<div class="page-sub">No members yet — add your CA / partners / team.</div>'}
    </div>`).join('')}</div>`;
}
function schedTab() {
  const sch = QLD.getSchedules(), groups = QLD.getGroups();
  const gName = id => (groups.find(g=>g.id===id)||{}).name || id;
  return `<div style="display:flex;flex-direction:column;gap:var(--ql-space-3)">
    <div class="ql-modal-note">⏱️ Scheduled reports appear as a reminder in your 🔔 notifications when due — tap to generate &amp; send in one go. (Fully-automatic background sending needs the server add-on.)</div>
    <button class="ql-btn ql-btn-primary" style="align-self:flex-start" onclick="addSchedule()">+ Schedule a report</button>
    ${sch.length ? sch.map((s,i)=>`<div class="rh-member"><div><b>${(QLD.REPORT_TYPES.find(t=>t.id===s.type)||{}).name||s.type}</b> · ${s.freq} → ${gName(s.group)}<div class="page-sub">Next due ${s.nextDue?QLD.fDS(s.nextDue):'—'}</div></div><button class="sr-kebab" onclick="delSchedule(${i})"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button></div>`).join('') : '<div class="page-sub">No scheduled reports yet.</div>'}
  </div>`;
}
function render() {
  document.getElementById('rhSub').textContent = `${QLD.co.short} · ${QLD.REPORT_TYPES.length} report types · ${QLD.getGroups().reduce((a,g)=>a+g.members.length,0)} recipients`;
  document.querySelectorAll('#rhTabs .sr-tab').forEach(t=>t.classList.toggle('active', t.dataset.t===tab));
  document.getElementById('rhBody').innerHTML = tab==='generate'?genTab():tab==='groups'?groupsTab():schedTab();
  // expose current-report export closures for the inline buttons
  window.__p = () => printReport(QLD.buildReport(selType, curRange().from, curRange().to));
  window.__x = () => csvReport(QLD.buildReport(selType, curRange().from, curRange().to));
  QLShell.paintWorkspace();
}
window.addMember = (gid) => QLShell.formPrompt('Add recipient', [
    {k:'name',label:'Name',req:true,full:true},
    {k:'channel',label:'Channel',type:'select',opts:[['whatsapp','WhatsApp'],['email','Email']]},
    {k:'value',label:'Phone or email',req:true,full:true}
  ], v => { const g=QLD.getGroups(); g.find(x=>x.id===gid).members.push({name:v.name,channel:v.channel,value:v.value}); QLD.saveGroups(g); render(); });
window.delMember = (gid,i) => { const g=QLD.getGroups(); g.find(x=>x.id===gid).members.splice(i,1); QLD.saveGroups(g); render(); };
window.addSchedule = () => QLShell.formPrompt('Schedule a report', [
    {k:'type',label:'Report',type:'select',opts:QLD.REPORT_TYPES.map(t=>[t.id,t.name]),full:true},
    {k:'freq',label:'Frequency',type:'select',opts:['Daily','Weekly','Monthly','Quarterly','Yearly']},
    {k:'group',label:'Send to',type:'select',opts:QLD.getGroups().map(g=>[g.id,g.name])}
  ], v => { const s=QLD.getSchedules(); const d=new Date(); const next={Daily:1,Weekly:7,Monthly:30,Quarterly:91,Yearly:365}[v.freq]||30; d.setDate(d.getDate()+next); s.push({id:Date.now(),type:v.type,freq:v.freq,group:v.group,nextDue:d.toISOString().slice(0,10)}); QLD.saveSchedules(s); render(); QLShell.toast('Report scheduled'); });
window.delSchedule = (i) => { const s=QLD.getSchedules(); s.splice(i,1); QLD.saveSchedules(s); render(); };
window.sendToGroup = sendToGroup;
document.querySelectorAll('#rhTabs .sr-tab').forEach(t => t.addEventListener('click', () => { tab=t.dataset.t; render(); }));
window.__qlOnSwitchCompany = id => QLD.switchCompany(id, render);
window.__qlRefresh = render;
QLD.init(render);
</script>
</body>
</html>
