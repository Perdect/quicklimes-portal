<script data-theme-boot>/* THEME BOOT — runs before the FIRST PAINT. The app shell applies the theme at
   mount, which is far too late: the browser would paint the page light and then
   flip, so a Light user on a dark Mac sees a white flash. Must stay in <head>,
   above every stylesheet. (It used to guard the launch splash; the splash is
   gone, the flash it prevents is not.) Resolves 'system' here too, so data-theme
   is ALWAYS a literal light|dark and CSS never has to ask twice. */
(function(){try{var t=localStorage.getItem('ql_theme')||'light';
var d=t==='dark'||(t!=='light'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches);
document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){}})();</script>

  table.bk-tbl th.num, table.bk-tbl td.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.bk-tbl td { padding: 11px 16px; border-bottom: 1px solid var(--ql-divider);

  .bk-m { font-weight: 700; color: var(--ql-text); }
  .bk-in { color: var(--ql-success-700); }
  .bk-out { color: var(--ql-danger-600); }
  .bk-mut { color: var(--ql-text-muted); }
  .bk-nar { color: var(--ql-text-secondary); max-width: 340px; overflow: hidden; text-overflow: ellipsis; }

  .bk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }

  .bk-bal .m { font-size: 11.5px; color: var(--ql-text-secondary); margin-top: 2px; }
  .bk-flows { display: flex; gap: 10px; }

  .bk-foot { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--ql-text-secondary); flex-wrap: wrap; }
  .bk-pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: 11px; font-weight: 600; }

<body class="ql-v2">
<div id="ql-page">
  <div class="dash qx qx-a-blue">
    <div id="bkHero"></div>
    <!-- The page binds handlers to these ids at MODULE SCOPE, and an inline
         onclick elsewhere clicks one of them. Keeping the original buttons here
         (hidden) leaves every one of those bindings untouched; the shared
         header's tools simply call their onclick. Removing them with the old
         header made `$('#bkManage').onclick = …` throw on null, which killed the
         rest of the page render — the body showed only the nav shell. -->
    <div hidden>
      <button id="bkManage" type="button"></button>
      <button id="bkAdd" type="button"></button>
      <button id="bkUpload" type="button"></button>
    </div>
    <div id="bkBody"></div>
  </div>
</div>

<script>
/* ── PAGE HEADER ────────────────────────────────────────────────────────────
   The app's shared header (QLX.heroHTML) — the same one the registers render.
   Rendered once, on DOM ready, so it is in place before the page's own code
   looks for anything inside it. */
const ICO = { gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>', plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>', up: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>' };
(function mountHero() {
  const go = () => {
    const host = document.getElementById('bkHero');
    if (!host || host.dataset.on) return;
    /* The header is chrome. If qlx.js failed to load, this page's own content
       must still render — so say so loudly and carry on, rather than taking
       the page down with the decoration. */
    if (!window.QLX || !QLX.heroHTML) { console.warn('QLX not loaded — shared page header skipped'); return; }
    host.dataset.on = '1';
    const cfg = { title: 'Banks',
      sub: '<span id="bkSub">Every account\'s balance, flows and reconciliation health</span>',
      tools: [{ label: 'Manage accounts', icon: ICO.gear, onClick: () => { const b = document.getElementById('bkManage'); if (b && b.onclick) b.onclick(); } }, { label: 'Add account', icon: ICO.plus, onClick: () => { const b = document.getElementById('bkAdd'); if (b && b.onclick) b.onclick(); } }],
      primary: { label: 'Import statement', icon: ICO.up, onClick: () => { const b = document.getElementById('bkUpload'); if (b && b.onclick) b.onclick(); } } };
    host.innerHTML = QLX.heroHTML(cfg);
    QLX.wireHero(host, cfg);
  };
  /* MOUNT SYNCHRONOUSLY. This waited for DOMContentLoaded, but QLD.init(render)
     fires render() during script execution when the data is already cached —
     BEFORE that event. render() then wrote to elements the header had not
     created yet ($('#bkSub').textContent on a null), threw, and aborted before
     filling the page body. The header looked perfect and everything under it
     was missing. This script sits below its host in the document, so the host
     already exists; the listener stays as a fallback and go() is idempotent. */
  go();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go);
})();

QLShell.mount({ active: 'banks', title: 'Banks' });
const $ = s => document.querySelector(s);
const esc = s => (s == null ? '' : s).toString().replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fC = v => QLD.fC(v);
const RC = window.ReconCore;
const BANK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 20 7 4 7"/></svg>';
const monLabel = ym => { try { return new Date(ym + '-01T00:00').toLocaleDateString('en-IN', { month: 'long', year: 'numeric' }); } catch (_) { return ym || ''; } };
const dLabel = d => { try { return QLD.fDS(d); } catch (_) { return d || '—'; } };

function render() {
  const accounts = QLD.bankAccounts();
  $('#bkSub').textContent = (QLD.co ? QLD.co.short + ' · ' : '') + accounts.length + ' account' + (accounts.length === 1 ? '' : 's');
  if (!accounts.length) {
    $('#bkBody').innerHTML = `<div class="bk-empty"><div style="width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:#eff4ff;color:#2563eb">${BANK_SVG}</div>
      <div style="font-weight:700;font-size:16px;color:var(--ql-text)">No bank accounts yet</div>
      <div style="max-width:380px">Add the accounts this firm banks with, then import each account's statement — every bank keeps its own balance here.</div>
      <button class="ql-btn ql-btn-primary" id="bkAddEmpty" style="margin-top:8px">+ Add your first account</button></div>`;
    $('#bkAddEmpty').onclick = addAccount;
    return;
  }
  const txns = QLD.recon.txns || [];
  const o = RC.accountOverview(txns, accounts);
  const byId = {}; o.accounts.forEach(r => { byId[r.id] = r; });
  const t = o.total;

  /* ── HEADLINE ────────────────────────────────────────────────────────────
     This was a heavy dark slab — the only one in the app, on a page that sits
     next to fifteen light ones. It is now the SHARED stat row every other
     page uses (QLX.statsHTML), so Banks reads as part of the product rather
     than a separate screen. Same four numbers, same source. */
  const negTotal = (t.balance || 0) < 0;
  const stats = QLX.statsHTML([
    { label: 'Total across all banks', value: fC(t.balance),
      sub: negTotal ? 'overdrawn' : 'in hand · ' + accounts.length + ' account' + (accounts.length === 1 ? '' : 's'),
      tint: negTotal ? 'red' : 'green',
      icon: '<line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 20 7 4 7"/>' },
    { label: 'Money in', value: t.ym ? '+' + fC(t.monthIn) : '—', sub: t.ym ? monLabel(t.ym) : 'no statement imported',
      tint: 'green', icon: '<path d="M12 3v14"/><polyline points="6 11 12 17 18 11"/><path d="M4 21h16"/>' },
    { label: 'Money out', value: t.ym ? '−' + fC(t.monthOut) : '—', sub: t.ym ? monLabel(t.ym) : 'no statement imported',
      tint: 'amber', icon: '<path d="M12 21V7"/><polyline points="6 13 12 7 18 13"/><path d="M4 3h16"/>' },
    { label: 'Needs review', value: o.accounts.reduce((a, r) => a + r.toReview, 0),
      sub: t.unassigned ? t.unassigned + ' unassigned to an account' : 'lines the matcher could not settle',
      tint: 'indigo', icon: '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>' }
  ]);

  const note = `<div class="bk-note-row">
    Flows exclude transfers between your own accounts — moving money bank-to-bank is never income or expense.
    ${t.internalMoved ? `<b>${fC(t.internalMoved)}</b> moved internally${t.ym ? ' in ' + esc(monLabel(t.ym)) : ''}.` : ''}
    ${t.unassigned ? `<b>${t.unassigned}</b> transaction${t.unassigned === 1 ? '' : 's'} not assigned to any account yet —
      <a href="reconcile.html">assign them from Bank Reconciliation</a>.` : ''}
  </div>`;

  const card = a => {
    const r = byId[a.id] || { n: 0, balance: +a.openingBalance || 0, monthIn: 0, monthOut: 0, toReview: 0, lastDate: '', ym: '', drift: null };
    const neg = (r.balance || 0) < 0;
    return `<div class="bk-card" data-acc="${esc(a.id)}" role="button" tabindex="0" aria-label="Open ${esc(a.label)} in reconciliation">
      <div class="bk-head"><span class="bk-ic">${BANK_SVG}</span>
        <div><div class="bk-name">${esc(a.label)}</div><div class="bk-sub">${esc(a.bank)}${a.acctNo ? ' · ··' + esc(String(a.acctNo).slice(-4)) : ''}</div></div>
        <span class="bk-type">${esc(QLD.BANK_TYPES[a.type] || 'Current')}</span></div>
      <div class="bk-bal"><div class="l">${neg ? (a.type === 'loan' ? 'Outstanding' : 'Overdrawn (Dr)') : 'Balance'}</div>
        <div class="v ${neg ? 'neg' : ''}">${fC(r.balance)}</div>
        <div class="m">${r.n ? 'as per statement · ' + dLabel(r.lastDate) : (+a.openingBalance ? 'opening balance — no statement yet' : 'no statement imported yet')}</div></div>
      ${r.n ? `<div class="bk-flows">
        <div class="bk-flow"><div class="l">In · ${esc(r.ym ? monLabel(r.ym).split(' ')[0] : '')}</div><div class="v in">+${fC(r.monthIn)}</div></div>
        <div class="bk-flow"><div class="l">Out · ${esc(r.ym ? monLabel(r.ym).split(' ')[0] : '')}</div><div class="v out">−${fC(r.monthOut)}</div></div>
      </div>` : ''}
      <div class="bk-foot">
        ${r.toReview ? `<span class="bk-pill warn">⚠ ${r.toReview} to review</span>` : (r.n ? '<span class="bk-pill ok">✓ reconciled</span>' : '')}
        ${r.drift != null && Math.abs(r.drift) > 1 ? `<span class="bk-pill drift" title="Statement balance differs from opening balance + imported flows — some months may be missing">± ${fC(Math.abs(r.drift))} unexplained</span>` : ''}
        <span style="margin-left:auto">${r.n} txn${r.n === 1 ? '' : 's'} →</span>
      </div>
    </div>`;
  };

  /* ── MONTH-BY-MONTH FLOWS ────────────────────────────────────────────────
     The page used to stop after two cards and leave two-thirds of the screen
     empty. This fills it with the thing the cards only hint at: how money
     actually moved, month by month, per account. Built from the SAME imported
     statement lines — nothing new is stored and nothing is estimated.
     Self-transfer legs are excluded, exactly as the headline flows are. */
  const ymOf = d => String(d || '').slice(0, 7);
  const flowRows = (() => {
    const by = {};
    txns.forEach(x => {
      if (RC.isSelfLeg && RC.isSelfLeg(x)) return;
      const m = ymOf(x.date); if (!/^\d{4}-\d{2}$/.test(m)) return;
      const g = by[m] || (by[m] = { ym: m, in: 0, out: 0, n: 0 });
      g.in += (+x.credit || 0); g.out += (+x.debit || 0); g.n++;
    });
    return Object.values(by).sort((a, b) => b.ym.localeCompare(a.ym)).slice(0, 12);
  })();
  const maxFlow = flowRows.reduce((m, r) => Math.max(m, r.in, r.out), 0) || 1;
  const flowsHTML = flowRows.length ? `<div class="bk-panel">
      <div class="bk-panel-h"><div class="bk-panel-t">Money in and out, by month</div>
        <div class="bk-panel-s">Across every account · self-transfers excluded</div></div>
      <div class="bk-tblwrap"><table class="bk-tbl">
        <thead><tr><th>Month</th><th class="num">In</th><th class="num">Out</th><th class="num">Net</th>
          <th style="width:34%">Relative size</th><th class="num">Lines</th></tr></thead>
        <tbody>${flowRows.map(r => {
          const net = r.in - r.out;
          return `<tr><td class="bk-m">${esc(monLabel(r.ym))}</td>
            <td class="num bk-in">+${fC(r.in)}</td>
            <td class="num bk-out">−${fC(r.out)}</td>
            <td class="num ${net >= 0 ? 'bk-in' : 'bk-out'}" style="font-weight:700">${net >= 0 ? '+' : '−'}${fC(Math.abs(net))}</td>
            <td><div class="bk-bars">
              <i class="in" style="width:${(r.in / maxFlow * 100).toFixed(1)}%"></i>
              <i class="out" style="width:${(r.out / maxFlow * 100).toFixed(1)}%"></i></div></td>
            <td class="num bk-mut">${r.n}</td></tr>`;
        }).join('')}</tbody></table></div>
    </div>` : '';

  /* Latest lines, so the page ends on something current rather than on air. */
  const recent = txns.slice().sort((a, b) => String(b.date || '').localeCompare(String(a.date || ''))).slice(0, 8);
  const accName = id => { const a = accounts.find(x => x.id === id); return a ? a.label : 'Unassigned'; };
  const recentHTML = recent.length ? `<div class="bk-panel">
      <div class="bk-panel-h"><div class="bk-panel-t">Latest statement lines</div>
        <div class="bk-panel-s">Newest first · <a href="reconcile.html">open Bank Reconciliation</a></div></div>
      <div class="bk-tblwrap"><table class="bk-tbl">
        <thead><tr><th>Date</th><th>Account</th><th>Narration</th><th class="num">In</th><th class="num">Out</th></tr></thead>
        <tbody>${recent.map(x => `<tr>
          <td class="bk-mut">${esc(dLabel(x.date))}</td>
          <td>${esc(accName(x.accountId))}</td>
          <td class="bk-nar">${esc((x.clean || x.raw || x.desc || '—')).slice(0, 70)}</td>
          <td class="num bk-in">${x.credit ? '+' + fC(x.credit) : ''}</td>
          <td class="num bk-out">${x.debit ? '−' + fC(x.debit) : ''}</td></tr>`).join('')}</tbody></table></div>
    </div>` : '';

  $('#bkBody').innerHTML = stats + note + `<div class="bk-grid">${accounts.map(card).join('')}</div>` + flowsHTML + recentHTML;
  document.querySelectorAll('[data-acc]').forEach(c => {
    const go = () => { location.href = 'reconcile.html?acc=' + encodeURIComponent(c.dataset.acc); };
    c.onclick = go;
    c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
  });
}

/* Add an account WITHOUT leaving the page. This page used to have no add form at
   all — its empty state bounced to Settings, which is a strange trip to take from
   the page whose whole subject is bank accounts. The field list is the SAME one
   Settings renders (ReconCore.bankFormSpecs); copying it here is what this codebase
   keeps doing wrong, so it is deliberately not copied. */
function addAccount() {
  QLShell.openForm({
    title: 'Add bank account', sub: (QLD.co ? QLD.co.short : '') + ' · multi-bank',
    specs: RC.bankFormSpecs(QLD.BANK_TYPES), saveLabel: 'Add account', initial: { type: 'current' },
    onSave(v) {
      if (!v.bank) { QLShell.toast('Bank name is required'); return false; }
      QLD.addBankAccount(v); QLShell.toast('Bank account added'); render();
    }
  });
}
$('#bkAdd').onclick = addAccount;
$('#bkManage').onclick = () => { location.href = 'settings.html'; };
$('#bkUpload').onclick = () => { location.href = 'reconcile.html?upload=1'; };
window.__qlOnSwitchCompany = () => render();   // shell owns the switch
window.__qlRefresh = render;
QLD.init(render);
</script>
</body>
</html>
