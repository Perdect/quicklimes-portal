<style>
  /* The select WEARS .qx-month rather than reimplementing it: the wrapper owns the
     border/height/radius from qlx.css, the select inside is stripped of its native
     chrome. One skin, one place — if .qx-month changes, this follows it. */
  .pd-head-r { display: flex; gap: 8px; align-items: center; flex: none; }
  .pd-msel-w { cursor: pointer; padding-right: 10px; }
  .pd-msel-w select { appearance: none; -webkit-appearance: none; border: 0; background: transparent;
    font: inherit; font-size: 13px; font-weight: 600; color: inherit; cursor: pointer; padding: 0; outline: none; }
  .pd-msel-chev { opacity: .55; }
</style>

<style>
  .pd-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: var(--ql-space-5); }
  .pd-kpi { background: var(--ql-card); border: 1px solid var(--ql-border); border-radius: 14px; padding: 16px; box-shadow: var(--ql-shadow-sm); }
  .pd-kpi .lb { font-size: 12px; color: var(--ql-text-muted); font-weight: 600; }
  .pd-kpi .v { font-size: 25px; font-weight: 800; letter-spacing: -.02em; margin-top: 6px; }
  .pd-kpi .m { font-size: 11.5px; color: var(--ql-text-muted); margin-top: 3px; }
  .pd-sec-h { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--ql-text-muted); margin: var(--ql-space-5) 0 var(--ql-space-3); }
  .pd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .pd-cat { background: var(--ql-card); border: 1px solid var(--ql-border); border-radius: 14px; padding: 14px 16px; box-shadow: var(--ql-shadow-sm); }
  .pd-cat .top { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
  .pd-cat .ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-size: 17px; flex: none; }
  .pd-cat .nm { font-weight: 700; font-size: 14px; } .pd-cat .sub { font-size: 11.5px; color: var(--ql-text-muted); }
  .pd-cat .v { font-size: 20px; font-weight: 800; }
  .pd-kv { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; border-top: 1px dashed var(--ql-border); }
  .pd-kv span:last-child { font-weight: 600; color: var(--ql-text); }
  .pd-tbl { width: 100%; border-collapse: collapse; background: var(--ql-card); border: 1px solid var(--ql-border); border-radius: 14px; overflow: hidden; }
  .pd-tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--ql-text-muted); padding: 10px 14px; border-bottom: 1px solid var(--ql-border); }
  .pd-tbl td { padding: 11px 14px; border-bottom: 1px solid var(--ql-border); font-size: 13.5px; }
  .pd-tbl tr:last-child td { border-bottom: 0; }
  .pd-tbl td.r, .pd-tbl th.r { text-align: right; }
  .pd-due { color: #dc2626; font-weight: 600; }
  .pd-alert { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: 11px; font-size: 13px; margin-bottom: 8px; }
  .pd-alert.warn { background: color-mix(in srgb, #f59e0b 9%, var(--ql-card)); border: 1px solid color-mix(in srgb, #f59e0b 28%, var(--ql-border)); }
  .pd-alert.info { background: color-mix(in srgb, var(--ql-brand-600) 7%, var(--ql-card)); border: 1px solid color-mix(in srgb, var(--ql-brand-600) 22%, var(--ql-border)); }
  .pd-empty { color: var(--ql-text-muted); font-size: 14px; padding: var(--ql-space-5); text-align: center; }
</style>
</head>
<body class="ql-v2">
<div id="ql-page">
  <div class="dash">
    <div class="page-head" style="display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap">
      <div>
        <h1 class="page-title">Purchase Dashboard</h1>
        <div class="page-sub" id="pdSub">Spend, categories, suppliers & dues — from your purchase bills</div>
      </div>
      <!-- A <select>, NOT a calendar popover. The app already carries three month
           pickers and the year-arrow bug has been fixed in two of them, twice; a
           fourth copy is exactly how that repeats. A select cannot have that bug,
           and for "which month" it is also less to learn. -->
      <!-- The SAME chrome the registers use — .qx-month and .qx-tool from qlx.css,
           which this page did not even load, which is why my first attempt looked
           like a browser default. Report is a <button>, not an <a>: that is why it
           rendered underlined. The month stays a <select> (the app already carries
           three calendar popovers and the year-arrow bug has been fixed in two of
           them twice) but now wears the register's skin. -->
      <div class="pd-head-r">
        <span class="qx-month pd-msel-w">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <select id="pdMonth" aria-label="Filter by month"></select>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="pd-msel-chev"><polyline points="6 9 12 15 18 9"/></svg>
        </span>
        <button class="qx-tool" id="pdReport" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="7" y1="8" x2="17" y2="8"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="7" y1="16" x2="13" y2="16"/></svg>
          Report
        </button>
      </div>
    </div>
    <div id="pdBody"></div>
  </div>
</div>

<script src="./wa-core.js?v=w2"></script>

<script src="./shell.js?v=m44"></script>
<script src="./mobile.js?v=m10"></script>
<script>
QLShell.mount({ active: 'purchasedash', title: 'Purchase Dashboard' });
const $ = s => document.querySelector(s);
const esc = s => (s == null ? '' : s).toString().replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fC = v => (window.QLD && QLD.fC) ? QLD.fC(v) : ('₹' + Math.round(v || 0).toLocaleString('en-IN'));
const nQ = v => (v || 0).toLocaleString('en-IN', { maximumFractionDigits: 1 });
const ym = d => String(d || '').slice(0, 7);

const CAT = {
  petcoke:   { ic: '🔥', bg: '#fdeceb', tint: '#c0392b', unit: 'T' },
  limestone: { ic: '🪨', bg: '#f6f0e4', tint: '#8a6d3b', unit: 'T' },
  packaging: { ic: '📦', bg: '#eaf1ff', tint: '#2f5fd0', unit: 'bags' },
  royalty:   { ic: '📜', bg: '#f2eefb', tint: '#6b3fa0', unit: '' },
  transport: { ic: '🚚', bg: '#e9f9ee', tint: '#1c7c3a', unit: '' },
  fuel:      { ic: '⛽', bg: '#fff5e0', tint: '#b7791f', unit: 'L' },
  labour:    { ic: '👷', bg: '#e9f9ee', tint: '#1c7c3a', unit: '' },
  maintenance: { ic: '🛠️', bg: '#f2eefb', tint: '#6b3fa0', unit: '' },
  electricity: { ic: '⚡', bg: '#fff5e0', tint: '#b7791f', unit: '' },
  bank:      { ic: '🏦', bg: '#eef2f7', tint: '#475569', unit: '' },
  other:     { ic: '📄', bg: '#f1f5f9', tint: '#64748b', unit: '' }
};

/* The month lives in QLD.uiMonth — the app's SHARED, per-company month state that
   qlx.js already reads. Setting it here means the Purchase Register opens on the
   same month, so "Report" continues the thought instead of resetting it. */
let pdMonth = QLD.uiMonth() || 'all';

function pdPaintMonthSel(all) {
  const sel = document.getElementById('pdMonth');
  if (!sel) return;
  const ms = [...new Set(all.map(r => (r.date || '').slice(0, 7)).filter(Boolean))].sort().reverse();
  if (!ms.includes(pdMonth)) pdMonth = 'all';        // a stored month with no bills would show an empty page
  sel.innerHTML = '<option value="all">All months</option>' +
    ms.map(m => `<option value="${m}" ${pdMonth === m ? 'selected' : ''}>${QLD.monthLabel(m, { blank: m })}</option>`).join('');
  sel.value = pdMonth;
  sel.onchange = () => { pdMonth = sel.value; if (pdMonth !== 'all') QLD.setUiMonth(pdMonth); render(); };
  const rep = document.getElementById('pdReport');
  // The register owns the report — the month rides across in uiMonth.
  if (rep) rep.onclick = () => { location.href = 'purchase.html'; };
}

function render() {
  const all = QLD.purchaseRows().filter(r => r.status !== 'cancelled');
  pdPaintMonthSel(all);
  /* Every card, alert and total below reads `rows`, so the month scopes the WHOLE
     page or none of it. One card filtered while its neighbour is not is the bug
     this app keeps producing. */
  const rows = pdMonth === 'all' ? all : all.filter(r => (r.date || '').slice(0, 7) === pdMonth);
  $('#pdSub').textContent = (QLD.co ? QLD.co.short + ' · ' : '') + (pdMonth === 'all' ? '' : QLD.monthLabel(pdMonth, { blank: pdMonth }) + ' · ') + 'from ' + rows.length + ' purchase bill' + (rows.length === 1 ? '' : 's');

  if (!rows.length) {
    $('#pdBody').innerHTML = `<div class="pd-empty" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:56px 20px">
      <div style="width:60px;height:60px;border-radius:16px;display:grid;place-items:center;background:#eaf1ff;font-size:28px;margin-bottom:6px">🛒</div>
      <div style="font-weight:700;font-size:16px;color:var(--ql-text)">No purchase bills yet</div>
      <div style="max-width:360px">Add or upload petcoke, limestone or bag invoices to see spend, categories and supplier dues here.</div>
      <a class="ql-btn ql-btn-primary" href="purchase" style="margin-top:12px;text-decoration:none">+ Add / Upload Bills</a>
    </div>`;
    return;
  }

  // Latest data month for the "this month" KPI.
  const months = [...new Set(rows.map(r => ym(r.date)).filter(Boolean))].sort();
  const latest = months[months.length - 1] || '';
  const monRows = rows.filter(r => ym(r.date) === latest);
  const monLbl = latest ? new Date(latest + '-01').toLocaleDateString('en-IN', { month: 'short', year: 'numeric' }) : '—';

  const sum = (rs, f) => rs.reduce((a, r) => a + (+f(r) || 0), 0);
  const totVal = sum(rows, r => r.total), monVal = sum(monRows, r => r.total);
  const gstPaid = sum(rows, r => r.gst);
  const pend = rows.filter(r => r.outstanding > 0.5);
  const pendVal = sum(pend, r => r.outstanding);
  /* Count distinct SUPPLIERS, not distinct spellings — a firm billed under two
     spellings counted twice here and overstated "Suppliers owed". */
  const dueIdx = QLParty.index(pend, r => r.sup, r => r.gstin);
  const supDue = [...new Set(pend.map(r => dueIdx.keyOf(r.sup, r.gstin)))].length;

  const kpis = [
    ['Purchases · ' + monLbl, fC(monVal), monRows.length + ' bills this month'],
    /* SAY WHICH FIGURE THIS IS. These totals are bill values INCLUDING GST — what
       leaves the bank. Inventory values the same bills EXCLUDING GST, because for
       costing the GST is reclaimable input credit, not a cost (getPL agrees — its
       COGS is ex-GST). Both are right for their purpose; the same 16 petcoke bills
       reading ₹88,77,112 here and ₹75,22,976 there with both called "purchase
       value" is not. Neither number moves — they are just named now. */
    ['Total purchases', fC(totVal), 'incl. GST · input GST ' + fC(gstPaid) + ' is reclaimable'],
    ['Pending bills', pend.length + '', fC(pendVal) + ' to pay'],
    ['Suppliers owed', supDue + '', supDue === 1 ? '1 supplier' : supDue + ' suppliers']
  ].map(k => `<div class="pd-kpi"><div class="lb">${esc(k[0])}</div><div class="v">${k[1]}</div><div class="m">${esc(k[2])}</div></div>`).join('');

  // Spend by category.
  const byG = {};
  rows.forEach(r => { const g = r.group || 'other'; (byG[g] = byG[g] || { qty: 0, val: 0, n: 0, label: r.groupLabel || g }).val += r.total; byG[g].qty += (+r.qty || 0); byG[g].n++; });
  const catCards = Object.entries(byG).sort((a, b) => b[1].val - a[1].val).map(([g, d]) => {
    const c = CAT[g] || CAT.other, avg = d.qty ? (sum(rows.filter(r => (r.group || 'other') === g), r => r.taxable) / d.qty) : 0;
    return `<div class="pd-cat"><div class="top"><div class="ic" style="background:${c.bg};color:${c.tint}">${c.ic}</div>
      <div><div class="nm">${esc(d.label)}</div><div class="sub">${d.n} bill${d.n > 1 ? 's' : ''}</div></div></div>
      <div class="v">${fC(d.val)}</div>
      ${d.qty ? `<div class="pd-kv"><span>Quantity</span><span>${nQ(d.qty)} ${c.unit}</span></div><div class="pd-kv"><span>Avg rate</span><span>${fC(avg)}/${c.unit || 'unit'}</span></div>` : ''}</div>`;
  }).join('');

  // Top suppliers by spend.
  /* Group by IDENTITY, not by whatever the bill spelled. Keying on r.sup put one
     firm (GSTIN 08AIUPB9022D1ZB) on two rows — "RAMKARAN AND SONS" and "Ramkaran
     and Sons" — and split its outstanding across both, so this table understated
     what was owed and mis-ranked who was owed it most. */
  const bySup = {};
  const sidx = QLParty.index(rows, r => r.sup, r => r.gstin);
  rows.forEach(r => {
    const k = sidx.keyOf(r.sup, r.gstin);
    (bySup[k] = bySup[k] || { spend: 0, due: 0, n: 0, last: '', gstin: sidx.gstinFor(k), nm: sidx.labelOf(k) }).spend += r.total;
    bySup[k].due += r.outstanding; bySup[k].n++; if (r.date > bySup[k].last) bySup[k].last = r.date;
  });
  const topSup = Object.entries(bySup).sort((a, b) => b[1].spend - a[1].spend).slice(0, 10);
  const supRows = topSup.map(([, d]) => `<tr><td>${esc(d.nm)}${d.gstin ? `<div style="font-size:11px;color:var(--ql-text-muted)">${esc(d.gstin)}</div>` : ''}</td>
    <td class="r">${d.n}</td><td class="r">${fC(d.spend)}</td><td class="r ${d.due > 0.5 ? 'pd-due' : ''}">${d.due > 0.5 ? fC(d.due) : '—'}</td><td class="r">${esc(d.last)}</td></tr>`).join('');

  // AI alerts (real, derived).
  const alerts = [];
  const worstDue = topSup.map(([, d]) => ({ nm: d.nm, due: d.due })).filter(x => x.due > 0.5).sort((a, b) => b.due - a.due)[0];
  const topCat = Object.entries(byG).sort((a, b) => b[1].val - a[1].val)[0];
  const catPct = topCat && totVal ? Math.round(topCat[1].val / totVal * 100) : 0;
  /* When your biggest supplier due IS your biggest category spend — one supplier
     for one material, which is the normal case here (Indian Oil sells the petcoke)
     — these were two alerts carrying one fact. The user reads both, compares the
     figures, finds them identical, and learns nothing from the second. Merge them
     into the one sentence that says it once. They stay separate when they are
     genuinely different money, because then it IS two facts. */
  const sameMoney = worstDue && topCat && Math.abs(worstDue.due - topCat[1].val) < 1;
  if (sameMoney) {
    alerts.push(['warn', '💸', `<b>${esc(worstDue.nm)}</b> — <b>${fC(worstDue.due)}</b> pending. Your biggest supplier due, and it is all <b>${esc(topCat[1].label)}</b> (${catPct}% of purchases). Prioritise this payment.`]);
  } else {
    if (worstDue) alerts.push(['warn', '💸', `<b>${esc(worstDue.nm)}</b> has the highest supplier due — <b>${fC(worstDue.due)}</b> pending. Prioritise this payment.`]);
    if (topCat) alerts.push(['info', '📊', `<b>${esc(topCat[1].label)}</b> is your biggest spend (incl. GST) at <b>${fC(topCat[1].val)}</b> (${catPct}% of purchases).`]);
  }
  const overdue = pend.filter(r => r.isOverdue);
  if (overdue.length) alerts.push(['warn', '⏰', `<b>${overdue.length}</b> bill${overdue.length > 1 ? 's are' : ' is'} overdue — ${fC(sum(overdue, r => r.outstanding))} past due.`]);

  $('#pdBody').innerHTML = `
    <div class="pd-kpis">${kpis}</div>
    ${alerts.length ? `<div class="pd-sec-h">AI alerts</div>${alerts.map(a => `<div class="pd-alert ${a[0]}"><span>${a[1]}</span><div>${a[2]}</div></div>`).join('')}` : ''}
    <div class="pd-sec-h">Spend by category</div>
    <div class="pd-grid">${catCards}</div>
    <div class="pd-sec-h">Top suppliers</div>
    <table class="pd-tbl"><thead><tr><th>Supplier</th><th class="r">Bills</th><th class="r">Spend</th><th class="r">Outstanding</th><th class="r">Last bill</th></tr></thead><tbody>${supRows}</tbody></table>`;
}

window.__qlOnSwitchCompany = () => render();
window.__qlRefresh = render;
QLD.init(render);
</script>
</body>
</html>
