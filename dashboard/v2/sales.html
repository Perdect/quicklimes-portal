<!-- ── LAUNCH BOOT SCREEN ────────────────────────────────────────────────
     Inline on purpose. This is the FIRST thing in <body> and it carries its
     own <style>, so it can paint with zero extra requests. Anything external
     (a css/js file) would land behind the app's own blocking resources and
     could not paint here. Continues the iOS launch image seamlessly: same
     mark, same size, same font stack, same centre — so there is no jump.
     QLShell.mount() calls hideSplash() the moment the shell is on screen.
     The 8s CSS failsafe is not decoration: if JS ever dies the splash MUST
     still get out of the way, because a permanently white screen is worse
     than the bug we are fixing. -->
<style id="ql-splash-css">
#ql-splash{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#F4F7FC;-webkit-user-select:none;user-select:none;transition:opacity .45s ease;animation:qs-failsafe .6s ease 8s forwards}
#ql-splash.qs-hide{opacity:0;pointer-events:none}
.qs-mark{width:84px;height:84px;border-radius:19px;box-shadow:0 12px 34px -10px rgba(0,115,236,.5)}
.qs-name{font:600 17px/1.2 -apple-system,system-ui,'Segoe UI',Roboto,sans-serif;letter-spacing:-.01em;color:#0F172A}
.qs-bar{position:absolute;bottom:16%;width:110px;height:3px;border-radius:3px;background:rgba(15,23,42,.1);overflow:hidden;opacity:0;animation:qs-show .3s ease .8s forwards}
.qs-bar::after{content:'';position:absolute;top:0;bottom:0;width:40%;border-radius:3px;background:#0073EC;animation:qs-run 1.15s ease-in-out infinite}
@keyframes qs-show{to{opacity:1}}
@keyframes qs-run{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
@keyframes qs-failsafe{to{opacity:0;visibility:hidden;pointer-events:none}}
@media (prefers-color-scheme:dark){#ql-splash{background:#020617}.qs-name{color:#F1F5F9}.qs-bar{background:rgba(241,245,249,.13)}}
@media (prefers-reduced-motion:reduce){.qs-bar::after{animation-duration:2.4s}}
</style>
