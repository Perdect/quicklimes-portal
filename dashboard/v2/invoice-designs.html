<script data-theme-boot>/* THEME BOOT — runs before the FIRST PAINT. The app shell applies the theme at
   mount, which is far too late: the browser would paint the page light and then
   flip, so a Light user on a dark Mac sees a white flash. Must stay in <head>,
   above every stylesheet. (It used to guard the launch splash; the splash is
   gone, the flash it prevents is not.) Resolves 'system' here too, so data-theme
   is ALWAYS a literal light|dark and CSS never has to ask twice. */
(function(){try{var t=localStorage.getItem('ql_theme')||'light';
var d=t==='dark'||(t!=='light'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches);
document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){}})();</script>

<script>
/* The app's shared header (QLX.heroHTML) — the same one the registers render. */
(function mountHero() {
  const go = () => {
    const host = document.getElementById('idHero');
    if (!host || host.dataset.on) return;
    /* The header is chrome. If qlx.js failed to load, this page's own content
       must still render — so say so loudly and carry on, rather than taking
       the page down with the decoration. */
    if (!window.QLX || !QLX.heroHTML) { console.warn('QLX not loaded — shared page header skipped'); return; }
    host.dataset.on = '1';
    const cfg = { title: 'Invoice Designs', sub: '<span id="idSub">Preview each design with your own invoice data</span>', tools: [] };
    host.innerHTML = QLX.heroHTML(cfg);
    QLX.wireHero(host, cfg);
  };
  /* MOUNT SYNCHRONOUSLY. This waited for DOMContentLoaded, but QLD.init(render)
     fires render() during script execution when the data is already cached —
     BEFORE that event. render() then wrote to elements the header had not
     created yet ($('#bkSub').textContent on a null), threw, and aborted before
     filling the page body. The header looked perfect and everything under it
     was missing. This script sits below its host in the document, so the host
     already exists; the listener stays as a fallback and go() is idempotent. */
  go();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go);
})();

QLShell.mount({ active: 'invoice-designs', title: 'Invoice Designs' });
const $ = s => document.querySelector(s);
const esc = s => (s == null ? '' : s).toString().replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let CUR = 'classic', ACCENT = '#2563EB', SALE_IDX = -1;   // -1 = the sample; set to a real invoice on first render

/* Preview against a REAL invoice wherever possible. A design review done on
   invented data tells you the design is pretty, not that it fits YOUR invoice —
   Gotan's address wraps, its buyer names are long, its quantities are 5 digits.
   Only when there are no sales at all do we fall back to a sample, and we say so. */
function sampleData() {
  const s = QLD.co || {};
  return {
    seller: s,
    hsn: s.hsn || '25221000',
    buyer: { name: 'Shree Cement Ltd', gstin: '08AABCS1429B1ZW', address: 'Bangur Nagar, Beawar, Rajasthan 305901', state: 'Rajasthan (08)' },
    inv: 'SAMPLE/2025-26', date: new Date().toISOString().slice(0, 10),
    product: 'Quick Lime', qty: 10000, rate: 9.7, unit: 'Tonne',
    veh: 'RJ21GA1234', eway: '881234567890', gstR: 5,
    taxable: 97000, cgst: 2425, sgst: 2425, igst: 0, interState: false,
    total: 101850, roundOff: 0, grand: 101850,
    words: QLD.amountInWords ? QLD.amountInWords(101850) : 'Rupees One Lakh One Thousand Eight Hundred Fifty Only'
  };
}

/* Default to an invoice that has actual VALUE on it. A design preview rendered on
   a ₹0.00 draft shows "0.00 / 0.00 / Rupees Zero Only" and tells you nothing about
   how the design handles a real five-digit quantity or a long buyer name — which
   is the only reason to look at it. Gotan's one sale right now is a zero-value
   draft, so without this the page would open on a blank-looking invoice. */
function firstRealSale() {
  const sales = (QLD.state && QLD.state.SALES) || [];
  for (let i = 0; i < sales.length; i++) {
    const d = QLD.invoiceData(i);
    if (d && (+d.grand || 0) > 0) return i;
  }
  return -1;
}

function currentData() {
  const sales = (QLD.state && QLD.state.SALES) || [];
  if (!sales.length || SALE_IDX < 0) return { d: sampleData(), real: false };
  const d = QLD.invoiceData(SALE_IDX);
  if (!d) return { d: sampleData(), real: false };
  // A zero-value invoice renders but shows nothing worth judging — say so plainly.
  return { d, real: true, empty: (+d.grand || 0) === 0 };
}

function paint() {
  const { d, real, empty } = currentData();
  const fr = $('#idFrame');
  if (fr) fr.srcdoc = InvoiceTemplates.render(d, { template: CUR, accent: ACCENT });
  document.querySelectorAll('.id-tab').forEach(b => b.classList.toggle('on', b.dataset.id === CUR));
  $('#idSub').textContent = !real
    ? 'Sample invoice — with your real company details, logo and bank accounts'
    : empty
      ? 'Previewing ' + (d.inv || '') + ' — this invoice has no quantity or rate, so it prints as zero'
      : 'Previewing your invoice ' + (d.inv || '') + ' — ' + (d.buyer.name || '');
}

function render() {
  const T = InvoiceTemplates.TEMPLATES;
  const sales = (QLD.state && QLD.state.SALES) || [];
  if (SALE_IDX === -1) { const r = firstRealSale(); if (r >= 0) SALE_IDX = r; }   // open on something worth looking at

  const tabs = T.map(t => `<button class="id-tab${t.id === CUR ? ' on' : ''}" data-id="${t.id}" onclick="pick('${t.id}')">
      <b>${esc(t.name)}</b><span>${esc(t.desc)}</span>
      ${t.id === 'classic' ? '<span class="badge">In use now</span>' : ''}</button>`).join('');

  const invOpts = '<option value="-1"' + (SALE_IDX === -1 ? ' selected' : '') + '>Sample invoice (10,000 Tonne)</option>'
    + sales.slice(0, 40).map((s, i) =>
    `<option value="${i}"${i === SALE_IDX ? ' selected' : ''}>${esc(s.inv || '(no number)')} — ${esc(s.party || '')}</option>`).join('');

  $('#idBody').innerHTML = `
    <div class="id-note"><span>👀</span><div>
      <b>Preview only.</b> Your invoices still print in the <b>Classic</b> format — nothing your customers receive has changed.
      Choosing a default, customising colours and saving your own designs come next.
    </div></div>
    <div class="id-tabs">${tabs}</div>
    <div class="id-bar">
      ${true ? `<label>Invoice <select id="idSale" onchange="pickSale(this.value)">${invOpts}</select></label>` : ''}
      <label>Accent <input type="color" id="idAccent" value="${ACCENT}" oninput="pickAccent(this.value)"></label>
      <span style="opacity:.7">— accent applies to Premium Glass and Vivid Business</span>
      <button class="ql-btn" style="margin-left:auto" onclick="printIt()">Print / PDF</button>
    </div>
    <div class="id-stage"><iframe id="idFrame" title="Invoice preview"></iframe></div>`;
  paint();
}

function pick(id) { CUR = id; paint(); }
function pickSale(i) { SALE_IDX = +i; paint(); }
function pickAccent(v) { ACCENT = v; paint(); }
function printIt() {
  const fr = document.getElementById('idFrame');
  if (fr && fr.contentWindow) { fr.contentWindow.focus(); fr.contentWindow.print(); }
}

window.__qlOnSwitchCompany = () => render();
window.__qlRefresh = render;
QLD.init(render);
</script>
