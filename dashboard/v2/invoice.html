#ql-splash{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:radial-gradient(130% 100% at 50% 0%,#fff 0%,#eef3fb 55%,#e4ecf7 100%);transition:opacity .5s ease,visibility .5s ease}
