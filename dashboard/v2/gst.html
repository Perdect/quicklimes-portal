<script data-theme-boot>/* THEME BOOT — runs before the FIRST PAINT. The app shell applies the theme at
   mount, which is far too late: the browser would paint the page light and then
   flip, so a Light user on a dark Mac sees a white flash. Must stay in <head>,
   above every stylesheet. (It used to guard the launch splash; the splash is
   gone, the flash it prevents is not.) Resolves 'system' here too, so data-theme
   is ALWAYS a literal light|dark and CSS never has to ask twice. */
(function(){try{var t=localStorage.getItem('ql_theme')||'light';
var d=t==='dark'||(t!=='light'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches);
document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){}})();</script>

<div id="ql-page">

    <div id="gsHero"></div>
    </div>
    <div id="gsKpis"></div>
    <div class="gst-grid">
      <div class="card gst-liab">
        <div class="card-head"><div><div class="card-title">Net GST Liability</div><div class="card-sub">Output tax payable minus input tax credit</div></div></div>

      </div>
      <div class="card">
        <div class="card-head"><div><div class="card-title">Taxable Value</div><div class="card-sub">Net of GST</div></div></div>
        <div class="gst-rows" id="gsTax"></div>
      </div>
    </div>
  </div>
</div>

<script>
QLShell.mount({ active: 'gst', title: 'GST Summary' });

/* The month/year filter. GST is a PERIOD tax — GSTR-3B is filed for one month —
   so this page had the strongest claim to the picker and none of it. Both sides
   of the liability are dated (sales, purchases), so every number below scopes
   honestly; nothing here is a running balance. */
let PF = null, HERO = null;

/* The GSTR figures this page already shows, as a file. Uses the shared
   QLShell.exportCSV so the escaping and filename rules match every other
   export in the app. */
const DL_ICON = '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>';
function exportGstr() {
  const per = PF ? PF.label() : 'All time';
  const g = QLD.gstSummary(PF ? PF.period() : null);
  QLShell.exportCSV(
    'gstr_' + String(QLD.co.short || 'summary').replace(/\s+/g, '_') + '_' + per.replace(/\s+/g, '_'),
    ['Line', 'Amount'],
    [['Period', per],
     ['Taxable sales', g.taxable], ['CGST (output)', g.cgst], ['SGST (output)', g.sgst], ['IGST (output)', g.igst],
     ['Total output GST', g.outGST], ['Taxable purchases', g.purchaseTaxable], ['Input tax credit', g.itc],
     ['Net payable', g.net]]);
}

const gstHave = () => new Set([...QLD.salesRows().map(r => (r.date || '').slice(0, 7)),
  ...QLD.purchaseRows().map(r => (r.date || '').slice(0, 7))].filter(Boolean));
function render() {
  /* One mount, not one per render: periodFilter appends its button, and calling
     it from render() would stack a new calendar button on every refresh. */
  /* The header is the app's shared one (QLX.heroHTML). It is rendered ONCE,
     before periodFilter mounts, because periodFilter prepends its month button
     into #gsActions — re-rendering the header on every refresh would throw that
     button away. `actionsId` keeps that container id, so the period control
     works exactly as it did. */
  if (!HERO) {
    HERO = { title: 'GST Summary', actionsId: 'gsActions',
      sub: '<span id="gsSub">Output tax · Input credit · Net liability</span>',
      /* The old header carried a "GSTR report" button with no click handler at
         all — it had never done anything. Rather than port a dead control into
         the new header, it downloads the GSTR summary this page already
         computes. */
      tools: [{ label: 'GSTR report', icon: DL_ICON, onClick: () => exportGstr() }] };
    document.getElementById('gsHero').innerHTML = QLX.heroHTML(HERO);
    QLX.wireHero(document.getElementById('gsHero'), HERO);
  }
  if (!PF) PF = QLShell.periodFilter('gsActions', { id: 'gsMonthBtn', have: gstHave, prepend: true, onChange: () => render() });
  const co = QLD.co, g = QLD.gstSummary(PF.period());
  const per = PF.label();
  const K = [
    { label: 'Output GST', v: QLD.fC(g.outGST), meta: 'collected on sales · ' + per, bg: 'var(--ql-brand-50)', fg: 'var(--ql-brand-600)', ic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>' },
    { label: 'Input Tax Credit', v: QLD.fC(g.itc), meta: 'paid on purchases · ' + per, bg: 'var(--ql-success-50)', fg: 'var(--ql-success-600)', ic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="17" y1="7" x2="7" y2="17"/><polyline points="17 17 7 17 7 7"/></svg>' },
    { label: 'Net Payable', v: QLD.fC(g.net), meta: 'to government · ' + per, bg: 'var(--ql-danger-50)', fg: 'var(--ql-danger-600)', ic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>' },
    { label: 'Taxable Sales', v: QLD.fC(g.taxable), meta: 'net of GST · ' + per, bg: 'var(--ql-warning-50)', fg: 'var(--ql-warning-600)', ic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-5"/></svg>' }
  ];
  /* The SHARED stat row (QLX.statsHTML) — the same component the Sales and
     Purchase registers use. The K array above is untouched: only its shape is
     adapted here, so every figure on this page is still computed by the same
     GST code as before. */
  document.getElementById('gsKpis').innerHTML = QLX.statsHTML(
    K.map(k => ({ label: k.label, value: k.v, sub: k.meta, icon: k.ic, tint: QLX.tint(k.bg) })));
  document.getElementById('gsSub').textContent = `${co.short} · ${per} · Net payable ${QLD.fC(g.net)}`;
  const liab = [
    { l: 'CGST (output)', v: g.cgst, sign: '+' },
    { l: 'SGST (output)', v: g.sgst, sign: '+' },
    { l: 'Total output tax', v: g.outGST, strong: true },
    { l: 'Less: Input tax credit', v: g.itc, sign: '−', credit: true },
    { l: 'Net GST payable', v: g.net, total: true }
  ];
  document.getElementById('gsLiab').innerHTML = liab.map(r => `<div class="gst-row ${r.total ? 'gst-row-total' : ''} ${r.strong ? 'gst-row-strong' : ''}"><span class="gst-row-l">${r.l}</span><span class="gst-row-v" style="${r.credit ? 'color:var(--ql-success-700)' : r.total ? 'color:var(--ql-danger-600)' : ''}">${r.sign || ''}${QLD.fC(r.v)}</span></div>`).join('');
  const tax = [
    { l: 'Taxable sales', v: g.taxable },
    { l: 'Taxable purchases', v: g.purchaseTaxable },
    { l: 'Net value added', v: Math.max(0, g.taxable - g.purchaseTaxable), total: true }
  ];
  document.getElementById('gsTax').innerHTML = tax.map(r => `<div class="gst-row ${r.total ? 'gst-row-total' : ''}"><span class="gst-row-l">${r.l}</span><span class="gst-row-v">${QLD.fC(r.v)}</span></div>`).join('');
  QLShell.paintWorkspace();
}
window.__qlOnSwitchCompany = () => render();   // shell owns the switch
QLD.init(render);
</script>
