<script data-theme-boot>/* THEME BOOT — runs before the FIRST PAINT. The app shell applies the theme at
   mount, which is far too late: the browser would paint the page light and then
   flip, so a Light user on a dark Mac sees a white flash. Must stay in <head>,
   above every stylesheet. (It used to guard the launch splash; the splash is
   gone, the flash it prevents is not.) Resolves 'system' here too, so data-theme
   is ALWAYS a literal light|dark and CSS never has to ask twice. */
(function(){try{var t=localStorage.getItem('ql_theme')||'light';
var d=t==='dark'||(t!=='light'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches);
document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){}})();</script>

<style>
/* ── Group Overview — consolidated multi-company reporting ── */
.gv-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:var(--ql-space-4)}
.gv-cos{display:inline-flex;background:var(--ql-neutral-100);border-radius:var(--ql-radius-xl);padding:4px;gap:2px}
.gv-co{height:36px;padding:0 14px;border:none;background:transparent;border-radius:var(--ql-radius-lg);font:inherit;font-size:var(--ql-text-base);font-weight:600;color:var(--ql-text-secondary);cursor:pointer;white-space:nowrap}
.gv-co.on{background:var(--ql-card);color:var(--ql-text);box-shadow:var(--ql-shadow-sm)}
.gv-co.on.all{background:var(--ql-brand-600);color:#fff}
.gv-sel{height:40px;padding:0 12px;border:1px solid var(--ql-border);border-radius:var(--ql-radius-xl);font:inherit;font-size:var(--ql-text-base);font-weight:600;background:var(--ql-card);color:var(--ql-text)}
.gv-date{height:40px;padding:0 10px;border:1px solid var(--ql-border);border-radius:var(--ql-radius-xl);font:inherit;font-size:var(--ql-text-sm);background:var(--ql-card);color:var(--ql-text)}
.gv-note{font-size:var(--ql-text-sm);color:var(--ql-text-secondary);background:var(--ql-brand-50);border:1px solid var(--ql-brand-100);border-radius:var(--ql-radius-lg);padding:8px 12px;margin-bottom:var(--ql-space-4)}
[data-theme="dark"] .gv-note{background:rgba(37,99,235,.12);border-color:rgba(37,99,235,.3)}
.gv-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:var(--ql-space-5)}
@media(max-width:1100px){.gv-kpis{grid-template-columns:repeat(2,1fr)}}
.gv-kpi{background:var(--ql-card);border:1px solid var(--ql-border);border-radius:var(--ql-radius-2xl);padding:16px 18px;box-shadow:var(--ql-shadow-xs)}
.gv-kpi .l{font-size:var(--ql-text-xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ql-text-muted)}
.gv-kpi .v{font-family:var(--ql-font-sans);font-size:var(--ql-text-2xl);font-weight:800;letter-spacing:-.02em;margin-top:6px}
.gv-kpi .s{font-size:var(--ql-text-sm);color:var(--ql-text-secondary);margin-top:2px}
.gv-h{font-size:var(--ql-text-lg);font-weight:700;margin:26px 0 10px}
.gv-tbl{width:100%;border-collapse:collapse;font-size:var(--ql-text-base);background:var(--ql-card);border:1px solid var(--ql-border);border-radius:var(--ql-radius-2xl);overflow:hidden}
.gv-tbl th{font-size:var(--ql-text-2xs);text-transform:uppercase;letter-spacing:.05em;color:var(--ql-text-muted);text-align:right;padding:10px 14px;border-bottom:1px solid var(--ql-border);background:var(--ql-neutral-50)}
[data-theme="dark"] .gv-tbl th{background:var(--ql-neutral-100)}
.gv-tbl th:first-child,.gv-tbl td:first-child{text-align:left}
.gv-tbl td{padding:10px 14px;border-bottom:1px solid var(--ql-divider);text-align:right;font-variant-numeric:tabular-nums}
.gv-tbl tr:last-child td{border-bottom:none}
.gv-tbl .tot td{font-weight:800;background:var(--ql-neutral-50);border-top:2px solid var(--ql-border)}
[data-theme="dark"] .gv-tbl .tot td{background:var(--ql-neutral-100)}
.gv-tbl .sec td{font-weight:700;color:var(--ql-text-secondary);background:var(--ql-neutral-50);font-size:var(--ql-text-sm)}
.gv-wrap{overflow-x:auto}
.gv-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.gv-cards{grid-template-columns:1fr}}
.gv-led{background:var(--ql-card);border:1px solid var(--ql-border);border-radius:var(--ql-radius-2xl);padding:16px 18px}
.gv-led h4{font-size:var(--ql-text-md);font-weight:700;margin:0 0 10px}
.gv-led table{width:100%;border-collapse:collapse;font-size:var(--ql-text-sm)}
.gv-led td{padding:5px 0;font-variant-numeric:tabular-nums}
.gv-led td:last-child{text-align:right;font-weight:600}
.gv-led .cl td{border-top:1px solid var(--ql-border);font-weight:800;padding-top:8px}
.gv-led .warn{color:var(--ql-warning-700);font-size:var(--ql-text-xs);margin-top:8px}
.gv-bars{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:8px}
.gv-bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;min-width:0}
.gv-bars i{display:block;border-radius:4px 4px 2px 2px;background:var(--ql-brand-500)}
.gv-bars .m{font-size:var(--ql-text-2xs);color:var(--ql-text-muted);text-align:center;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gv-exp summary{cursor:pointer;font-weight:600;color:var(--ql-brand-700);font-size:var(--ql-text-sm);list-style:none;padding:6px 0}
.gv-exp summary::-webkit-details-marker{display:none}
.gv-empty{color:var(--ql-text-secondary);font-size:var(--ql-text-base);background:var(--ql-warning-50);border:1px solid #fde68a;border-radius:var(--ql-radius-lg);padding:10px 14px;margin:8px 0}
[data-theme="dark"] .gv-empty{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.3)}
/* firm split under each KPI + company badges in detail rows */
.gv-split{display:flex;flex-direction:column;gap:3px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--ql-border)}
.gv-split span{display:flex;align-items:center;gap:6px;font-size:var(--ql-text-sm);color:var(--ql-text-secondary);justify-content:space-between}
.gv-split b{font-variant-numeric:tabular-nums;color:var(--ql-text)}
.gv-dot{width:8px;height:8px;border-radius:50%;flex:none;margin-right:2px}
.gv-dot.mine{background:var(--ql-brand-600)}
.gv-dot.partner{background:var(--ql-success-600,#16A34A)}
.gv-split span i+*{flex:1}
.gv-badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:var(--ql-text-2xs);font-weight:700;white-space:nowrap}
.gv-badge.mine{background:var(--ql-brand-50);color:var(--ql-brand-700)}
.gv-badge.partner{background:var(--ql-success-50,#DCFCE7);color:var(--ql-success-700,#15803D)}
[data-theme="dark"] .gv-badge.mine{background:rgba(37,99,235,.18);color:#93C5FD}
[data-theme="dark"] .gv-badge.partner{background:rgba(22,163,74,.18);color:#86EFAC}
.gv-bad{color:var(--ql-danger-600);font-size:var(--ql-text-sm);font-weight:600;margin-top:6px}
/* ── DATA SOURCES strip (§9) — printed before any money figure, because it
   is the answer to "why is that blank?". Four independent sources. ── */
.gv-srcs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:var(--ql-space-4)}
@media(max-width:820px){.gv-srcs{grid-template-columns:repeat(2,1fr)}}
.gv-src{display:flex;align-items:center;gap:10px;background:var(--ql-card);border:1px solid var(--ql-border);border-radius:var(--ql-radius-xl);padding:10px 14px}
.gv-src-i{width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:50%;font-size:13px;font-weight:800}
.gv-src.on .gv-src-i{background:var(--ql-success-50,#DCFCE7);color:var(--ql-success-700,#15803D)}
.gv-src.off{background:var(--ql-neutral-50);border-style:dashed}
.gv-src.off .gv-src-i{background:var(--ql-neutral-100);color:var(--ql-text-muted)}
.gv-src-l{font-size:var(--ql-text-sm);font-weight:700}
.gv-src.off .gv-src-l{color:var(--ql-text-secondary)}
.gv-src-s{font-size:var(--ql-text-xs);color:var(--ql-text-muted)}
[data-theme="dark"] .gv-src.on .gv-src-i{background:rgba(22,163,74,.18);color:#86EFAC}
/* A tile with no entitlement to a number: dashed, muted, reason in place of the value */
.gv-kpis-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.gv-kpis-4{grid-template-columns:repeat(2,1fr)}}
.gv-kpi.na{border-style:dashed;background:var(--ql-neutral-50)}
.gv-kpi.na .v{color:var(--ql-text-muted);font-weight:700}
.gv-kpi.na .s{color:var(--ql-text-secondary)}
[data-theme="dark"] .gv-kpi.na{background:var(--ql-neutral-100)}
/* ── Tabs — Overview holds the summary, everything else is one click away ── */
.gv-tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--ql-border);margin-bottom:var(--ql-space-5);padding-bottom:0;-webkit-overflow-scrolling:touch}
.gv-tab{flex:none;height:40px;padding:0 16px;border:none;background:transparent;font:inherit;font-size:var(--ql-text-base);font-weight:600;color:var(--ql-text-secondary);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.gv-tab:hover{color:var(--ql-text)}
.gv-tab.on{color:var(--ql-brand-700);border-bottom-color:var(--ql-brand-600)}
[data-theme="dark"] .gv-tab.on{color:#93C5FD;border-bottom-color:#3B82F6}
#gvRoot section[hidden]{display:none}
.gv-note-mut{background:var(--ql-neutral-50);border-color:var(--ql-border);color:var(--ql-text-secondary)}
[data-theme="dark"] .gv-note-mut{background:var(--ql-neutral-100);border-color:var(--ql-border)}
@media print{
  .ql-sidebar,.ql-topbar,nav,#gvCsv,#gvPrint,.gv-cos,.gv-sel,.gv-date{display:none!important}
  body,#ql-page,.dash,.card{background:#fff!important;margin:0;padding:0}
  .gv-tbl{page-break-inside:auto}.gv-tbl tr{page-break-inside:avoid}
  .gv-h{page-break-after:avoid}
}
</style>

<script>
/* The app's shared header (QLX.heroHTML) — the same one the registers render.
   This page's logic lives in an external file, so the header is mounted here
   rather than threaded through it. */
(function () {
  const go = () => {
    const host = document.getElementById('gvHero');
    if (!host || host.dataset.on) return;
    /* The header is chrome. If qlx.js failed to load, this page's own content
       must still render — so say so loudly and carry on, rather than taking
       the page down with the decoration. */
    if (!window.QLX || !QLX.heroHTML) { console.warn('QLX not loaded — shared page header skipped'); return; }
    host.dataset.on = '1';
    const cfg = { title: 'Group Overview', sub: 'All companies, one truth — purchase · production · sales · stock, company-wise', tools: [] };
    host.innerHTML = QLX.heroHTML(cfg);
    QLX.wireHero(host, cfg);
  };
  /* MOUNT SYNCHRONOUSLY. This waited for DOMContentLoaded, but QLD.init(render)
     fires render() during script execution when the data is already cached —
     BEFORE that event. render() then wrote to elements the header had not
     created yet ($('#bkSub').textContent on a null), threw, and aborted before
     filling the page body. The header looked perfect and everything under it
     was missing. This script sits below its host in the document, so the host
     already exists; the listener stays as a fallback and go() is idempotent. */
  go();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go);
})();
</script>
