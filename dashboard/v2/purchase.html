<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purchase Register — QuickLimes v2</title>
<meta name="theme-color" content="#2563EB">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./tokens.css"><link rel="stylesheet" href="./shell.css"><link rel="stylesheet" href="./pages.css"><link rel="stylesheet" href="./finance.css"><link rel="stylesheet" href="./purchase.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./data.js"></script>
<script src="./finance.js"></script>
</head>
<body class="ql-v2">
<div id="ql-page">
  <div class="dash pr2">
    <div class="page-head">
      <div><h1 class="page-title">Purchase Register</h1><div class="page-sub" id="prSub">Loading…</div></div>
      <div class="page-actions">
        <button class="ql-btn ql-btn-secondary" id="puReport"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="15"/><line x1="9" y1="11" x2="12" y2="11"/></svg> Report</button>
        <button class="ql-btn ql-btn-secondary" id="puImport"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> Import</button>
        <button class="ql-btn ql-btn-secondary" id="puExport"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Export</button>
        <button class="ql-btn ql-btn-primary" onclick="QLShell.openPurchaseForm()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add Bill</button>
      </div>
    </div>

    <div class="prc" id="prCards"></div>

    <div class="prf" id="prFilter">
      <div class="prf-row">
        <select class="prf-sel" id="pfGroup"></select>
        <select class="prf-sel" id="pfStatus"></select>
        <div class="prf-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="prSearch" placeholder="Search bill, supplier, item…"></div>
        <button class="prf-btn" id="pfMore"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg> Filters</button>
        <div class="prf-cols-wrap"><button class="prf-btn" id="pfCols"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg> Columns</button><div class="prf-cols-menu" id="pfColsMenu" hidden></div></div>
        <button class="prf-btn prf-reset" id="pfReset" hidden>Reset</button>
      </div>
      <div class="prf-adv" id="prfAdv" hidden>
        <select class="prf-sel" id="pfItem"></select>
        <select class="prf-sel" id="pfSup"></select>
        <select class="prf-sel" id="pfDept"></select>
        <select class="prf-sel" id="pfGst"></select>
        <input class="prf-date" type="date" id="pfFrom" title="From"><span class="prf-dash">–</span><input class="prf-date" type="date" id="pfTo" title="To">
      </div>
    </div>

    <div class="prt-card">
      <div class="prt-scroll"><table class="prt"><thead id="prHead"></thead><tbody id="prBody"></tbody></table></div>
      <div class="prt-pager"><span id="prCount">—</span><div class="sr-pager"><button id="prPrev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button><span id="prPage">1</span><button id="prNext"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button></div></div>
    </div>

    <div class="prfoot" id="prFoot"></div>
  </div>
</div>

<div class="pdrawer-back" id="pdrawerBack"><aside class="pdrawer" id="pdrawer"></aside></div>
<div id="prToast" class="fin-toast" hidden></div>

<script src="./shell.js"></script>
<script src="./purchase.js"></script>
</body>
</html>
