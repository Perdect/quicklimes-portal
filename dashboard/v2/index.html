<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<script data-theme-boot>/* THEME BOOT — runs before the FIRST PAINT. The app shell applies the theme at
   mount, which is far too late: the browser would paint the page light and then
   flip, so a Light user on a dark Mac sees a white flash. Must stay in <head>,
   above every stylesheet. (It used to guard the launch splash; the splash is
   gone, the flash it prevents is not.) Resolves 'system' here too, so data-theme
   is ALWAYS a literal light|dark and CSS never has to ask twice. */
(function(){try{var t=localStorage.getItem('ql_theme')||'system';
var d=t==='dark'||(t!=='light'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches);
document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickLimes</title>
<meta name="theme-color" content="#2563EB">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<style>
  html, body { margin: 0; height: 100%; background: #F8FAFC; }
  .ld { height: 100%; display: flex; align-items: center; justify-content: center;
        font-family: 'Inter', system-ui, -apple-system, sans-serif; color: #64748B; }
  .sp { width: 26px; height: 26px; border: 3px solid #E2E8F0; border-top-color: #2563EB;
        border-radius: 50%; animation: sp .7s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
<script>
  // /v2/ entry — forward to the dashboard, preserving the #auth= handoff
  // hash and any query string so the data layer can pick up the session.
  // Build an absolute target so it works whether the URL is /v2/, /v2,
  // or /v2/index.html (servers differ on trailing-slash normalisation).
  (function () {
    var dir = location.pathname.replace(/index\.html$/, '');
    if (dir.charAt(dir.length - 1) !== '/') dir += '/';
    location.replace(dir + 'dashboard.html' + location.search + location.hash);
  })();
</script>
</head>
<body>
<div class="ld"><div class="sp"></div></div>
</body>
</html>
