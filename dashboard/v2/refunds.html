<script data-theme-boot>/* THEME BOOT — runs before the FIRST PAINT. The app shell applies the theme at
   mount, which is far too late: the browser would paint the page light and then
   flip, so a Light user on a dark Mac sees a white flash. Must stay in <head>,
   above every stylesheet. (It used to guard the launch splash; the splash is
   gone, the flash it prevents is not.) Resolves 'system' here too, so data-theme
   is ALWAYS a literal light|dark and CSS never has to ask twice. */
(function(){try{var t=localStorage.getItem('ql_theme')||'light';
var d=t==='dark'||(t!=='light'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches);
document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){}})();</script>

    <!-- The page binds handlers to these ids at MODULE SCOPE, and an inline
         onclick elsewhere clicks one of them. Keeping the original buttons here
         (hidden) leaves every one of those bindings untouched; the shared
         header's tools simply call their onclick. Removing them with the old
         header made `$('#rfUpload').onclick = …` throw on null, which killed the
         rest of the page render — the body showed only the nav shell. -->

<script>
/* ── PAGE HEADER ────────────────────────────────────────────────────────────
   The app's shared header (QLX.heroHTML) — the same one the registers render.
   Rendered once, on DOM ready, so it is in place before the page's own code
   looks for anything inside it. */
const ICO = { gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>', plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>', up: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>' };
(function mountHero() {
  const go = () => {
    const host = document.getElementById('rfHero');
    if (!host || host.dataset.on) return;
    /* The header is chrome. If qlx.js failed to load, this page's own content
       must still render — so say so loudly and carry on, rather than taking
       the page down with the decoration. */
    if (!window.QLX || !QLX.heroHTML) { console.warn('QLX not loaded — shared page header skipped'); return; }
    host.dataset.on = '1';
    const cfg = { title: 'GST Refunds',
      sub: '<span id="rfSub">Petcoke / inverted-duty refunds · CA commission tracking</span>',
      tools: [{ label: 'Upload RFD', icon: ICO.up, onClick: () => { const b = document.getElementById('rfUpload'); if (b && b.onclick) b.onclick(); } }],
      primary: { label: 'Add refund', icon: ICO.plus, onClick: () => { const b = document.getElementById('rfAdd'); if (b && b.onclick) b.onclick(); } } };
    host.innerHTML = QLX.heroHTML(cfg);
    QLX.wireHero(host, cfg);
  };
  /* MOUNT SYNCHRONOUSLY. This waited for DOMContentLoaded, but QLD.init(render)
     fires render() during script execution when the data is already cached —
     BEFORE that event. render() then wrote to elements the header had not
     created yet ($('#bkSub').textContent on a null), threw, and aborted before
     filling the page body. The header looked perfect and everything under it
     was missing. This script sits below its host in the document, so the host
     already exists; the listener stays as a fallback and go() is idempotent. */
  go();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go);
})();

QLShell.mount({ active: 'refunds', title: 'GST Refunds' });
const $ = s => document.querySelector(s);
const esc = s => (s == null ? '' : s).toString().replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fC = v => (window.QLD && QLD.fC) ? QLD.fC(v) : ('₹' + Math.round(v || 0).toLocaleString('en-IN'));

/* Summary of what the parser actually read off the RFD-01, so the numbers going
   into the form can be checked against the receipt at a glance. The heads must
   sum to the total — we show that verdict rather than leaving it implied. */
function readCard(r) {
  const ok = r.balanced && !(r.review || []).length;
  const fact = (k, v) => v ? `<div class="f"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>` : '';
  const head = (k, v, cls) => `<div class="h ${cls || ''}"><div class="k">${esc(k)}</div><div class="v">${fC(v)}</div></div>`;
  const period = [r.fromPeriod, r.toPeriod].filter(Boolean).join(' → ');
  const flags = { arn: 'ARN', gstin: 'GSTIN', amount: 'amounts', total: 'printed total' };
  const bad = (r.review || []).map(x => flags[x] || x).join(', ');
  return `<div class="qlf-read">
    <div class="qlf-read-top">
      <span class="qlf-read-badge${ok ? '' : ' warn'}">${ok ? '✓ Read from ' + esc(r.kind || 'RFD-01') : '⚠ Check ' + esc(bad || 'values')}</span>
      <span class="qlf-read-title">${esc(r.tradeName || 'GST refund application')}</span>
      ${r.inverted ? '<span class="qlf-read-badge">Inverted duty · §54(3)</span>' : ''}
    </div>
    <div class="qlf-read-facts">
      ${fact('ARN', r.arn)}${fact('GSTIN', r.gstin)}${fact('Filed on', r.appDate)}
      ${fact('Period', period)}${fact('Legal name', r.legalName)}
    </div>
    <div class="qlf-read-heads">
      ${head('IGST', r.igst)}${head('CGST', r.cgst)}${head('SGST', r.sgst)}${head('CESS', r.cess)}
      ${head('Total claimed', r.total, 'total')}
    </div>
    ${r.reason ? `<div class="qlf-read-note"><b>Reason:</b> ${esc(r.reason)}</div>` : ''}
    <div class="qlf-read-note">${r.balanced
      ? 'IGST + CGST + SGST + CESS = Total ✓ matches the receipt.'
      : 'Heads do not add up to the printed total — verify against the receipt before saving.'}</div>
  </div>`;
}

function specsFor(r) {
  return [
    ...(r && r.__read ? [{ type: 'html', html: readCard(r) }] : []),
    { type: 'section', label: 'Application' },
    { k: 'arn', label: 'ARN (application ref no)', upper: true },
    { k: 'appDate', label: 'Date filed (dd/mm/yyyy)' },
    { k: 'fromPeriod', label: 'From period' },
    { k: 'toPeriod', label: 'To period' },
    { k: 'reason', label: 'Reason', full: true },
    { type: 'section', label: 'Amount claimed (₹)' },
    { k: 'igst', label: 'IGST', type: 'number', quarter: true },
    { k: 'cgst', label: 'CGST', type: 'number', quarter: true },
    { k: 'sgst', label: 'SGST', type: 'number', quarter: true },
    { k: 'cess', label: 'CESS', type: 'number', quarter: true },
    { type: 'section', label: 'Status & CA commission' },
    { k: 'status', label: 'Status', type: 'select', opts: [['filed', 'Filed (RFD-01)'], ['sanctioned', 'Sanctioned (RFD-06)'], ['received', 'Received in bank']] },
    { k: 'caRate', label: 'CA commission %', type: 'number' },
    { k: 'receivedAmount', label: 'Amount received (₹)', type: 'number' },
    { k: 'receivedDate', label: 'Date received' },
    { k: 'note', label: 'Note', full: true }
  ];
}
const SPECS = specsFor(null);

function openRefundForm(initial, idx) {
  const init = Object.assign({ caRate: 5, status: 'filed' }, initial || {});
  const specs = specsFor(initial);
  QLShell.openForm({
    title: idx == null ? 'Add GST refund' : 'Edit refund',
    sub: initial && initial.__read ? 'Imported from the RFD-01 receipt — check and save' : 'Petcoke / inverted-duty refund',
    wide: true, specs, saveLabel: idx == null ? 'Add refund' : 'Save', initial: init,
    onSave(v) { if (idx == null) QLD.addRefund(v); else QLD.updateRefund(idx, v); render(); }
  });
}

// ── PDF/image → text → parse RFD-01 → prefill the form ──
let _pdfjs = null;
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function pdfText(file) {
  if (!_pdfjs) { if (!window.pdfjsLib) { await loadScript('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js'); window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'; } _pdfjs = window.pdfjsLib; }
  const buf = await file.arrayBuffer();
  const doc = await _pdfjs.getDocument({ data: buf }).promise;
  let txt = '';
  for (let i = 1; i <= doc.numPages; i++) { const c = await (await doc.getPage(i)).getTextContent(); txt += c.items.map(x => x.str).join('\n') + '\n'; }
  return txt;
}
$('#rfUpload').onclick = () => $('#rfFile').click();
$('#rfFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  if (!/\.pdf$/i.test(f.name)) { QLShell.toast('Please upload the RFD-01 PDF (image OCR coming soon)'); return; }
  QLShell.toast('Reading RFD receipt…');
  try {
    const t = await pdfText(f);
    const r = window.QLRefundOCR.parseRFD(t);
    if (!r.total && !r.arn) { QLShell.toast('Could not read this as an RFD receipt — add it manually'); return; }
    r.__read = true;
    openRefundForm(r);
    QLShell.toast(r.balanced && !r.review.length
      ? 'Read ' + (r.kind || 'RFD-01') + ' · ' + fC(r.total) + ' claimed'
      : 'Read with gaps — check the highlighted values');
  } catch (err) { QLShell.toast('Could not read the PDF — add it manually'); }
};

function pill(s) { const lbl = { filed: 'Filed', sanctioned: 'Sanctioned', received: 'Received' }[s] || s; return `<span class="rf-pill ${s}">${lbl}</span>`; }
function render() {
  const rows = QLD.refundRows(), s = QLD.refundSummary();
  $('#rfSub').textContent = (QLD.co ? QLD.co.short + ' · ' : '') + rows.length + ' refund' + (rows.length === 1 ? '' : 's') + ' · CA commission tracked';
  if (!rows.length) {
    $('#rfBody').innerHTML = `<div class="rf-empty"><div style="width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:#eff4ff;font-size:26px">🏛️</div>
      <div style="font-weight:700;font-size:16px;color:var(--ql-text)">No GST refunds yet</div>
      <div style="max-width:360px">Upload an RFD-01 receipt to auto-fill the ARN, period and amounts — or add one manually. CA commission &amp; net retention compute automatically.</div>
      <button class="ql-btn ql-btn-primary" onclick="document.getElementById('rfUpload').click()" style="margin-top:10px">⬆ Upload RFD-01</button></div>`;
    return;
  }
  const kpis = [
    ['Total claimed', fC(s.claimed), rows.length + ' applications'],
    ['Received', fC(s.received), s.receivedCount + ' credited'],
    ['Pending', fC(s.pending), (rows.length - s.receivedCount) + ' awaiting'],
    ['CA commission', fC(s.caPaid), 'on received refunds'],
    ['Net retention', fC(s.netRet), 'after CA fee']
  ].map(k => `<div class="rf-kpi"><div class="lb">${esc(k[0])}</div><div class="v">${k[1]}</div><div class="m">${esc(k[2])}</div></div>`).join('');
  const body = rows.map(r => `<tr>
    <td><b>${esc(r.arn || '—')}</b><div style="font-size:11px;color:var(--ql-text-soft)">${esc(r.kind)}${r.appDate ? ' · ' + esc(r.appDate) : ''}</div></td>
    <td>${esc(r.period || '—')}<div style="font-size:11px;color:var(--ql-text-soft)">${esc((r.reason || '').slice(0, 34))}</div></td>
    <td class="r">${fC(r.total)}<div style="font-size:10.5px;color:var(--ql-text-soft)">I ${fC(r.igst)} · C ${fC(r.cgst)} · S ${fC(r.sgst)}</div></td>
    <td>${pill(r.status)}</td>
    <td class="r">${r.status === 'received' ? fC(r.received) : '—'}${r.receivedDate ? `<div style="font-size:10.5px;color:var(--ql-text-soft)">${esc(r.receivedDate)}</div>` : ''}</td>
    <td class="r">${r.caRate}%</td>
    <td class="r">${r.status === 'received' ? fC(r.caCommission) : `<span style="color:var(--ql-text-soft)" title="expected on receipt">~${fC(r.expectedComm)}</span>`}</td>
    <td class="r"><b>${r.status === 'received' ? fC(r.netRetention) : '—'}</b></td>
    <td class="r" style="white-space:nowrap">
      ${r.status !== 'received' ? `<button class="rf-act" data-recv="${r.idx}">Mark received</button>` : ''}
      <button class="rf-act" data-jrnl="${r.idx}">Journal</button>
      <button class="rf-act" data-edit="${r.idx}">Edit</button>
      <button class="rf-act" data-del="${r.idx}" style="color:#b91c1c">✕</button>
    </td></tr>`).join('');
  $('#rfBody').innerHTML = `
    <div class="rf-note">ℹ️ <div>Petcoke input GST (18%) exceeds quick-lime output GST (5%), so ITC accumulates → refundable under the <b>Inverted Duty Structure §54(3)</b>. CA commission is charged only on amounts <b>received</b> (default 5%; editable per refund).</div></div>
    <div class="rf-kpis">${kpis}</div>
    <div style="overflow-x:auto"><table class="rf-tbl"><thead><tr><th>ARN</th><th>Period / reason</th><th class="r">Claimed</th><th>Status</th><th class="r">Received</th><th class="r">CA%</th><th class="r">CA fee</th><th class="r">Net</th><th></th></tr></thead><tbody>${body}</tbody></table></div>`;

  $('#rfBody').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { const r = QLD.refundRows().find(x => x.idx === +b.dataset.edit); openRefundForm(r, +b.dataset.edit); });
  $('#rfBody').querySelectorAll('[data-del]').forEach(b => b.onclick = () => QLShell.confirmDelete({ title: 'Delete this refund record?', desc: 'The RFD entry and its commission tracking will be removed.', confirmLabel: 'Delete', onConfirm() { QLD.deleteRefund(+b.dataset.del); render(); } }));
  $('#rfBody').querySelectorAll('[data-recv]').forEach(b => b.onclick = () => {
    const row = QLD.refundRows().find(x => x.idx === +b.dataset.recv);
    QLShell.openForm({ title: 'Mark refund received', sub: 'ARN ' + (row.arn || ''), saveLabel: 'Confirm received',
      specs: [{ k: 'receivedAmount', label: 'Amount received (₹)', type: 'number', req: true }, { k: 'receivedDate', label: 'Date received (yyyy-mm-dd)' }],
      initial: { receivedAmount: row.total, receivedDate: new Date().toISOString().slice(0, 10) },
      onSave(v) { QLD.updateRefund(+b.dataset.recv, { status: 'received', receivedAmount: v.receivedAmount, receivedDate: v.receivedDate }); render(); } });
  });
  $('#rfBody').querySelectorAll('[data-jrnl]').forEach(b => b.onclick = () => {
    const row = QLD.refundRows().find(x => x.idx === +b.dataset.jrnl);
    const j = QLD.refundJournal(row);
    const html = j.map(e => `<div style="margin-bottom:16px"><div style="font-weight:600;font-size:13px;color:var(--ql-text)">${esc(e.title)}${e.when ? ' · ' + esc(e.when) : ''}</div>
      <table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:6px">${e.lines.map(l => `<tr><td style="padding:6px 8px;border-bottom:1px solid var(--ql-border)">${esc(l.acc)}</td><td style="padding:6px 8px;border-bottom:1px solid var(--ql-border);text-align:right;color:${l.dr ? '#0f172a' : 'var(--ql-text-soft)'}">${l.dr ? 'Dr ' + fC(l.dr) : ''}</td><td style="padding:6px 8px;border-bottom:1px solid var(--ql-border);text-align:right;color:${l.cr ? '#0f172a' : 'var(--ql-text-soft)'}">${l.cr ? 'Cr ' + fC(l.cr) : ''}</td></tr>`).join('')}</table></div>`).join('');
    const back = document.createElement('div');
    back.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
    back.innerHTML = `<div style="background:var(--ql-surface);border-radius:16px;max-width:520px;width:100%;max-height:82vh;overflow:auto;padding:22px;box-shadow:var(--ql-shadow-lg)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div><div style="font-weight:800;font-size:16px">Accounting journal</div><div style="font-size:12px;color:var(--ql-text-soft)">ARN ${esc(row.arn || '—')} · double-entry</div></div>
      <button id="rfJx" style="border:none;background:var(--ql-neutral-100);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px">✕</button></div>${html}</div>`;
    document.body.appendChild(back);
    const close = () => back.remove();
    back.onclick = e => { if (e.target === back) close(); };
    back.querySelector('#rfJx').onclick = close;
  });
}
window.__qlOnSwitchCompany = () => render();
window.__qlRefresh = render;
$('#rfAdd').onclick = () => openRefundForm();
QLD.init(render);
</script>
</body>
</html>
