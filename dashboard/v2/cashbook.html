<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cash Book — QuickLimes v2</title>
<meta name="theme-color" content="#2563EB">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./tokens.css"><link rel="stylesheet" href="./shell.css"><link rel="stylesheet" href="./pages.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./data.js"></script>
</head>
<body class="ql-v2">
<div id="ql-page">
  <div class="dash">
    <div class="page-head">
      <div><h1 class="page-title">Cash Book</h1><div class="page-sub" id="cbSub">Cash · PhonePe · Bank ledger</div></div>
      <div class="page-actions">
        <button class="ql-btn ql-btn-secondary"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Export</button>
        <button class="ql-btn ql-btn-primary"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> New entry</button>
      </div>
    </div>
    <div class="kpi-strip" id="cbKpis" style="grid-template-columns:repeat(4,1fr)"></div>
    <div class="card" style="gap:var(--ql-space-4)">
      <div class="sr-toolbar">
        <div class="sr-tabs" id="cbTabs">
          <button class="sr-tab active" data-f="all">All</button>
          <button class="sr-tab" data-f="credit">Money In</button>
          <button class="sr-tab" data-f="debit">Money Out</button>
        </div>
        <div class="sr-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="cbSearch" placeholder="Search party, category, ref…"></div>
      </div>
      <div class="sr-table-wrap"><table class="sr"><thead><tr id="cbHead"></tr></thead><tbody id="cbBody"></tbody></table></div>
      <div class="sr-foot"><span id="cbCount">—</span><div class="sr-pager"><button id="cbPrev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button><span id="cbPage" style="font-size:var(--ql-text-sm)">1</span><button id="cbNext"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button></div></div>
    </div>
  </div>
</div>
<script src="./shell.js"></script>
<script>
QLShell.mount({ active: 'cashbook', title: 'Cash Book' });
const PER = 14;
let cFilter = 'all', cQuery = '', cSort = { key: 'date', dir: 'desc' }, cPage = 1;
const MODE = { cash: 'Cash', phonepay: 'PhonePe', bank: 'Bank' };
const COLS = [
  { key: 'date', label: 'Date', sortable: true },
  { key: 'party', label: 'Party / Note', sortable: true },
  { key: 'category', label: 'Category', sortable: true },
  { key: 'mode', label: 'Mode', sortable: true },
  { key: 'type', label: 'In / Out', sortable: true },
  { key: 'amount', label: 'Amount', sortable: true, num: true }
];
function filtered() {
  let r = QLD.cashbookRows();
  if (cFilter !== 'all') r = r.filter(x => x.type === cFilter);
  if (cQuery) { const q = cQuery.toLowerCase(); r = r.filter(x => (x.party + ' ' + x.category + ' ' + x.ref + ' ' + x.notes).toLowerCase().includes(q)); }
  r.sort((a, b) => { let x = a[cSort.key], y = b[cSort.key]; if (typeof x === 'string') { x = x.toLowerCase(); y = (y || '').toLowerCase(); } return x < y ? (cSort.dir === 'asc' ? -1 : 1) : x > y ? (cSort.dir === 'asc' ? 1 : -1) : 0; });
  return r;
}
function render() {
  const co = QLD.co, b = QLD.cashbookBalances();
  const K = [
    { label: 'Cash in Hand', v: QLD.fC(b.cash), meta: 'physical cash', bg: 'var(--ql-success-50)', fg: 'var(--ql-success-600)', ic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>' },
    { label: 'PhonePe', v: QLD.fC(b.phonepay), meta: 'UPI wallet', bg: '#EEF2FF', fg: '#4F46E5', ic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2.5"/><line x1="12" y1="18" x2="12" y2="18"/></svg>' },
    { label: 'Bank', v: QLD.fC(b.bank), meta: 'account balance', bg: 'var(--ql-brand-50)', fg: 'var(--ql-brand-600)', ic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V8.5a1 1 0 0 1 .5-.87L12 4l6.5 3.63a1 1 0 0 1 .5.87V21"/><line x1="9" y1="11" x2="9" y2="17"/><line x1="15" y1="11" x2="15" y2="17"/></svg>' },
    { label: 'Total Balance', v: QLD.fC(b.total), meta: `${b.count} entries`, bg: 'var(--ql-warning-50)', fg: 'var(--ql-warning-600)', ic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20"/></svg>' }
  ];
  document.getElementById('cbKpis').innerHTML = K.map(k => `<div class="kpi-tile"><div class="kpi-head"><div class="kpi-ic" style="background:${k.bg};color:${k.fg}">${k.ic}</div></div><div><div class="kpi-label">${k.label}</div><div class="kpi-val" style="${k.v.includes('-') ? 'color:var(--ql-danger-600)' : ''}">${k.v}</div><div class="kpi-meta">${k.meta}</div></div></div>`).join('');
  document.getElementById('cbSub').textContent = `${co.short} · ${b.count} entries · ${QLD.fC(b.total)} total balance`;
  document.getElementById('cbHead').innerHTML = COLS.map(c => { const st = cSort.key === c.key; return `<th class="${st ? 'sorted' : ''} ${c.num ? 'sr-num' : ''}" data-sort="${c.key}">${c.label}<span class="sort-ic">${st ? (cSort.dir === 'asc' ? '▲' : '▼') : '↕'}</span></th>`; }).join('') + '<th class="no-sort"></th>';
  document.querySelectorAll('#cbHead th[data-sort]').forEach(th => th.addEventListener('click', () => { const k = th.dataset.sort; if (cSort.key === k) cSort.dir = cSort.dir === 'asc' ? 'desc' : 'asc'; else { cSort.key = k; cSort.dir = 'asc'; } cPage = 1; render(); }));
  const rows = filtered(), pages = Math.max(1, Math.ceil(rows.length / PER)); cPage = Math.min(cPage, pages);
  const slice = rows.slice((cPage - 1) * PER, cPage * PER);
  document.getElementById('cbBody').innerHTML = slice.length ? slice.map(r => {
    const cr = r.type === 'credit';
    const label = r.party || r.notes || (cr ? 'Receipt' : 'Payment');
    return `<tr>
      <td class="pt-muted">${QLD.fDS(r.date)}</td>
      <td><div style="font-weight:600;color:var(--ql-text)">${label}</div>${r.ref ? `<div style="font-size:var(--ql-text-xs);color:var(--ql-text-secondary)">${r.ref}</div>` : ''}</td>
      <td><span class="sr-pill neutral">${r.category || '—'}</span></td>
      <td class="pt-muted">${MODE[r.mode] || r.mode || '—'}</td>
      <td><span class="sr-pill ${cr ? 'credit' : 'debit'}"><span class="dot"></span>${cr ? 'In' : 'Out'}</span></td>
      <td class="sr-num" style="font-weight:700;color:${cr ? 'var(--ql-success-700)' : 'var(--ql-danger-600)'}">${cr ? '+' : '−'}${QLD.fC(r.amount)}</td>
      <td class="sr-num"><button class="sr-kebab"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button></td>
    </tr>`;
  }).join('') : `<tr><td colspan="7"><div class="sr-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg><div style="font-weight:600;color:var(--ql-text-secondary)">No entries in this view</div></div></td></tr>`;
  document.getElementById('cbCount').textContent = rows.length ? `Showing ${(cPage - 1) * PER + 1}–${Math.min(cPage * PER, rows.length)} of ${rows.length}` : '0 entries';
  document.getElementById('cbPage').textContent = `${cPage} / ${pages}`;
  document.getElementById('cbPrev').disabled = cPage <= 1; document.getElementById('cbNext').disabled = cPage >= pages;
  QLShell.paintWorkspace();
}
document.querySelectorAll('#cbTabs .sr-tab').forEach(t => t.addEventListener('click', () => { document.querySelectorAll('#cbTabs .sr-tab').forEach(x => x.classList.remove('active')); t.classList.add('active'); cFilter = t.dataset.f; cPage = 1; render(); }));
document.getElementById('cbSearch').addEventListener('input', e => { cQuery = e.target.value; cPage = 1; render(); });
document.getElementById('cbPrev').addEventListener('click', () => { if (cPage > 1) { cPage--; render(); } });
document.getElementById('cbNext').addEventListener('click', () => { cPage++; render(); });
window.__qlOnSwitchCompany = id => QLD.switchCompany(id, render);
QLD.init(render);
</script>
</body>
</html>
