<script data-theme-boot>/* THEME BOOT — runs before the FIRST PAINT. The app shell applies the theme at
   mount, which is far too late: the browser would paint the page light and then
   flip, so a Light user on a dark Mac sees a white flash. Must stay in <head>,
   above every stylesheet. (It used to guard the launch splash; the splash is
   gone, the flash it prevents is not.) Resolves 'system' here too, so data-theme
   is ALWAYS a literal light|dark and CSS never has to ask twice. */
(function(){try{var t=localStorage.getItem('ql_theme')||'light';
var d=t==='dark'||(t!=='light'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches);
document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){}})();</script>

<script>
QLShell.mount({ active: 'pl', title: 'Profit & Loss' });

/* The month/year filter. "Did I make money in March" is the question a P&L is
   FOR, and this page could only answer "ever".

   The honest catch, surfaced rather than hidden: revenue, material cost and GST
   are all dated and scope cleanly — but a WORKER record carries a wage and no
   date, and attendance is keyed by day-number inside one unlabelled month grid.
   So all-time labour = the worker masters (unchanged), and a picked period =
   dated cash-book wage payments — the same rule the Reports Hub's date-scoped
   P&L already uses. The two bases genuinely differ, so the line below NAMES the
   one in use. Subtracting an all-time wage bill from one month's revenue would
   have been the alternative, and it would have reported a loss where he made a
   profit. */
let PF = null, HERO = null;
const DL_ICON = '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>';
const PLUS_ICON = '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>';

/* The income statement this page already builds, as a file. The old header
   carried an "Export" button with no click handler at all — it had never done
   anything; this is what it always looked like it did. */
function exportPL() {
  const per = PF ? PF.label() : 'All time';
  const p = QLD.getPL(PF ? PF.period() : null);
  QLShell.exportCSV('profit_loss_' + String(QLD.co.short || '').replace(/\s+/g, '_') + '_' + per.replace(/\s+/g, '_'),
    ['Line', 'Amount'],
    [['Period', per], ['Revenue (taxable sales)', p.rev], ['Cost of materials', p.cogs], ['Gross profit', p.gp],
     ['Labour', p.labour], ['EBITDA', p.ebitda], ['Net GST payable', p.netGST], ['Net profit', p.np],
     ['Net margin %', p.npm]]);
}
const plHave = () => new Set([...QLD.salesRows().map(r => (r.date || '').slice(0, 7)),
  ...QLD.purchaseRows().map(r => (r.date || '').slice(0, 7))].filter(Boolean));
function render() {
  /* The app's shared header (QLX.heroHTML), rendered ONCE — before
     periodFilter mounts, because periodFilter prepends its month button into
     #plActions. Re-rendering the header each refresh would throw that button
     away, and `actionsId` is what keeps that container id alive. */
  if (!HERO) {
    HERO = { title: 'Profit & Loss', actionsId: 'plActions',
      sub: '<span id="plSub"></span>',
      tools: [{ label: 'Export', icon: DL_ICON, onClick: () => exportPL() }] };
    document.getElementById('plHero').innerHTML = QLX.heroHTML(HERO);
    QLX.wireHero(document.getElementById('plHero'), HERO);
  }
  if (!PF) PF = QLShell.periodFilter('plActions', { id: 'plMonthBtn', have: plHave, prepend: true, onChange: () => render() });
  const co = QLD.co, p = QLD.getPL(PF.period());
  const per = PF.label(), scoped = p.labourSrc === 'cashbook';
  document.getElementById('plScope').textContent = per + ' · ' + (scoped
    ? 'labour = cash-book wage payments in this period (worker records carry no date)'
    : 'derived from your sales, purchases & labour');
  const K = [
    { label: 'Revenue', v: QLD.fC(p.rev), meta: 'taxable sales', bg: 'var(--ql-brand-50)', fg: 'var(--ql-brand-600)', ic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-5"/></svg>' },
    { label: 'Gross Profit', v: QLD.fC(p.gp), meta: p.gpm.toFixed(1) + '% margin', bg: 'var(--ql-success-50)', fg: 'var(--ql-success-600)', ic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M5 12l7-7 7 7"/></svg>' },
    { label: 'EBITDA', v: QLD.fC(p.ebitda), meta: 'after labour', bg: 'var(--ql-warning-50)', fg: 'var(--ql-warning-600)', ic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>' },
    { label: 'Net Profit', v: QLD.fC(p.np), meta: p.npm.toFixed(1) + '% margin', bg: p.np >= 0 ? 'var(--ql-success-50)' : 'var(--ql-danger-50)', fg: p.np >= 0 ? 'var(--ql-success-600)' : 'var(--ql-danger-600)', ic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>' }
  ];
  /* The SHARED stat row (QLX.statsHTML) — the same component the registers
     use. The K array above is untouched: only its shape is adapted here, so
     every figure on this page is still computed by the code that always
     computed it. */
  document.getElementById('plKpis').innerHTML = QLX.statsHTML(
    K.map(k => ({ label: k.label, value: k.v, sub: k.meta, icon: k.ic, tint: QLX.tint(k.bg) })));
  document.getElementById('plSub').textContent = `${co.short} · ${per} · Net profit ${QLD.fC(p.np)} (${p.npm.toFixed(1)}%)`;
  const rows = [
    { l: 'Revenue (taxable sales)', v: p.rev, sign: '' },
    { l: 'Less: Cost of materials', v: p.cogs, sign: '−', neg: true },
    { l: 'Gross profit', v: p.gp, strong: true },
    // The label names its own source — see the note above render().
    { l: scoped ? 'Less: Labour paid (cash book)' : 'Less: Labour cost', v: p.labour, sign: '−', neg: true },
    { l: 'EBITDA', v: p.ebitda, strong: true },
    { l: 'Less: Net GST payable', v: p.netGST, sign: '−', neg: true },
    { l: 'Net profit', v: p.np, total: true }
  ];
  document.getElementById('plRows').innerHTML = rows.map(r => `<div class="gst-row ${r.total ? 'gst-row-total' : ''} ${r.strong ? 'gst-row-strong' : ''}"><span class="gst-row-l">${r.l}</span><span class="gst-row-v" style="${r.neg ? 'color:var(--ql-danger-600)' : r.total ? (p.np >= 0 ? 'color:var(--ql-success-700)' : 'color:var(--ql-danger-600)') : ''}">${r.sign || ''}${QLD.fC(r.v)}</span></div>`).join('');
  const margins = [
    { l: 'Gross margin', v: p.gpm.toFixed(1) + '%' },
    { l: 'Net margin', v: p.npm.toFixed(1) + '%' },
    { l: 'Output GST', v: QLD.fC(p.outGST) },
    { l: 'Input tax credit', v: QLD.fC(p.itc) },
    { l: 'Net GST payable', v: QLD.fC(p.netGST), total: true }
  ];
  document.getElementById('plMargins').innerHTML = margins.map(r => `<div class="gst-row ${r.total ? 'gst-row-total' : ''}"><span class="gst-row-l">${r.l}</span><span class="gst-row-v">${r.v}</span></div>`).join('');
  QLShell.paintWorkspace();
}
window.__qlOnSwitchCompany = () => render();   // shell owns the switch
window.__qlRefresh = render;
QLD.init(render);
</script>
