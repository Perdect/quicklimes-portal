<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Deshwali Minerals — Admin Panel</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--p:#7C3AED;--pd:#5B21B6;--pl:#EDE9FE;--green:#10B981;--red:#EF4444;--amber:#F59E0B;--dark:#111827;--slate:#374151;--muted:#6B7280;--border:#E5E7EB;--bg:#F3F4F6;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--slate);}

/* ── LOGIN ── */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1E1B4B,#2D1B69);}
.login-box{background:#fff;border-radius:20px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 24px 80px rgba(0,0,0,.3);text-align:center;}
.login-logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--p),#A78BFA);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:1.1rem;margin:0 auto 16px;}
.login-box h2{font-size:1.3rem;font-weight:800;color:var(--dark);margin-bottom:.3rem;}
.login-box p{font-size:.83rem;color:var(--muted);margin-bottom:1.6rem;}
.login-box input{width:100%;padding:.8rem 1rem;border:1.5px solid var(--border);border-radius:10px;font-size:.95rem;font-family:inherit;margin-bottom:12px;outline:none;transition:border .15s;}
.login-box input:focus{border-color:var(--p);}
.login-btn{width:100%;padding:.85rem;border:none;border-radius:10px;background:var(--p);color:#fff;font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s;}
.login-btn:hover{background:var(--pd);}
.login-err{color:var(--red);font-size:.83rem;margin-top:10px;display:none;}

/* ── DASHBOARD ── */
#dashboard{display:none;min-height:100vh;}
header{background:linear-gradient(135deg,#1E1B4B,#2D1B69);padding:0 6%;height:64px;display:flex;align-items:center;justify-content:space-between;}
.h-brand{display:flex;align-items:center;gap:10px;}
.h-icon{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:.85rem;}
.h-name{color:#fff;font-weight:800;font-size:1rem;}
.h-name span{color:#A78BFA;}
.h-right{display:flex;align-items:center;gap:12px;}
.h-badge{background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);padding:.3rem .8rem;border-radius:20px;font-size:.75rem;font-weight:600;}
.logout-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:.4rem .9rem;border-radius:8px;cursor:pointer;font-size:.8rem;font-weight:600;font-family:inherit;transition:background .15s;}
.logout-btn:hover{background:rgba(255,255,255,.2);}

.main{max-width:1200px;margin:0 auto;padding:32px 6%;}

/* ── STAT CARDS ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px;}
.stat{background:#fff;border-radius:14px;padding:20px;border:1.5px solid var(--border);display:flex;align-items:center;gap:14px;}
.stat-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;}
.stat-val{font-size:1.6rem;font-weight:800;color:var(--dark);line-height:1;}
.stat-label{font-size:.75rem;color:var(--muted);margin-top:3px;}

/* ── TABS ── */
.tabs{display:flex;gap:8px;margin-bottom:20px;}
.tab{padding:.6rem 1.4rem;border-radius:10px;border:1.5px solid var(--border);background:#fff;cursor:pointer;font-size:.88rem;font-weight:600;color:var(--muted);transition:all .15s;font-family:inherit;}
.tab.active{background:var(--p);border-color:var(--p);color:#fff;}

/* ── TABLE ── */
.table-wrap{background:#fff;border-radius:16px;border:1.5px solid var(--border);overflow:hidden;}
.tw-header{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px;}
.tw-title{font-size:.95rem;font-weight:700;color:var(--dark);}
.tw-actions{display:flex;gap:8px;align-items:center;}
.search-input{padding:.5rem .9rem;border:1.5px solid var(--border);border-radius:8px;font-size:.83rem;font-family:inherit;outline:none;width:200px;transition:border .15s;}
.search-input:focus{border-color:var(--p);}
.export-btn{padding:.5rem 1rem;border:1.5px solid var(--p);border-radius:8px;background:transparent;color:var(--p);font-size:.83rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;}
.export-btn:hover{background:var(--pl);}
.refresh-btn{padding:.5rem 1rem;border:1.5px solid var(--border);border-radius:8px;background:transparent;color:var(--slate);font-size:.83rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;}
.refresh-btn:hover{background:var(--bg);}
table{width:100%;border-collapse:collapse;}
th{padding:11px 16px;text-align:left;font-size:.73rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--border);}
td{padding:12px 16px;font-size:.83rem;color:var(--slate);border-bottom:1px solid var(--border);vertical-align:top;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#FAFAFA;}
.badge{display:inline-block;padding:.2rem .6rem;border-radius:20px;font-size:.7rem;font-weight:700;}
.badge-en{background:#EDE9FE;color:var(--pd);}
.badge-hi{background:#FEF3C7;color:#92400E;}
.badge-product{background:#D1FAE5;color:#065F46;}
.empty-state{text-align:center;padding:48px 20px;color:var(--muted);}
.empty-state .es-icon{font-size:2.5rem;margin-bottom:12px;}
.loading{text-align:center;padding:40px;color:var(--muted);font-size:.9rem;}
.td-name{font-weight:600;color:var(--dark);}
.td-phone a{color:var(--p);text-decoration:none;font-weight:600;}
.td-phone a:hover{text-decoration:underline;}
.td-time{color:var(--muted);font-size:.77rem;white-space:nowrap;}
.delete-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:.85rem;padding:2px 6px;border-radius:6px;transition:all .15s;}
.delete-btn:hover{color:var(--red);background:#FEE2E2;}
.pagination{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);flex-wrap:wrap;gap:8px;}
.pg-info{font-size:.8rem;color:var(--muted);}
.pg-btns{display:flex;gap:6px;}
.pg-btn{padding:.4rem .8rem;border:1.5px solid var(--border);border-radius:7px;background:#fff;cursor:pointer;font-size:.8rem;font-family:inherit;transition:all .15s;}
.pg-btn:hover{border-color:var(--p);color:var(--p);}
.pg-btn:disabled{opacity:.4;cursor:default;}
.panel-section{display:none;}
.panel-section.active{display:block;}

@media(max-width:900px){.stats{grid-template-columns:1fr 1fr;}.main{padding:24px 4%;}}
@media(max-width:560px){.stats{grid-template-columns:1fr 1fr;}.tw-header{flex-direction:column;align-items:flex-start;}.search-input{width:100%;}}

/* ── ICON SYSTEM ── */
.icon{display:inline-block;width:1em;height:1em;vertical-align:-0.14em;flex-shrink:0;}
.flag-badge{display:inline-block;padding:.1em .45em;border-radius:4px;font-size:.7em;font-weight:700;letter-spacing:.5px;vertical-align:middle;background:rgba(124,58,237,.12);color:var(--p,#7C3AED);}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">DM</div>
    <h2>Admin Panel</h2>
    <p>Deshwali Minerals — Inquiry Management</p>
    <input id="adminPass" type="password" placeholder="Enter admin password" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="login-btn" onclick="doLogin()">Sign In →</button>
    <p class="login-err" id="loginErr">Incorrect password. Try again.</p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <header>
    <div class="h-brand">
      <div class="h-icon">DM</div>
      <div class="h-name">Deshwali <span>Minerals</span></div>
    </div>
    <div class="h-right">
      <span class="h-badge"><svg class="icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Admin</span>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
  </header>

  <div class="main">
    <!-- Stats -->
    <div class="stats">
      <div class="stat">
        <div class="stat-icon" style="background:#EDE9FE;"><svg class="icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></div>
        <div><div class="stat-val" id="st-inquiries">—</div><div class="stat-label">Total Inquiries</div></div>
      </div>
      <div class="stat">
        <div class="stat-icon" style="background:#D1FAE5;"><svg class="icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="1"/><path d="M16 7V3H8v4"/><path d="M8 11h4M8 15h4M16 11h.01M16 15h.01"/></svg></div>
        <div><div class="stat-val" id="st-listings">—</div><div class="stat-label">Business Listings</div></div>
      </div>
      <div class="stat">
        <div class="stat-icon" style="background:#FEF3C7;"><svg class="icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
        <div><div class="stat-val" id="st-today">—</div><div class="stat-label">Today's Leads</div></div>
      </div>
      <div class="stat">
        <div class="stat-icon" style="background:#DBEAFE;"><svg class="icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></div>
        <div><div class="stat-val" id="st-sources">2</div><div class="stat-label">Active Pages</div></div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('inquiries',this)"><svg class="icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg> Contact Inquiries</button>
      <button class="tab" onclick="switchTab('listings',this)"><svg class="icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="1"/><path d="M16 7V3H8v4"/><path d="M8 11h4M8 15h4M16 11h.01M16 15h.01"/></svg> Business Listings</button>
    </div>

    <!-- Inquiries Panel -->
    <div id="panel-inquiries" class="panel-section active">
      <div class="table-wrap">
        <div class="tw-header">
          <div class="tw-title">Contact Inquiries</div>
          <div class="tw-actions">
            <input class="search-input" type="text" placeholder="Search name, phone…" oninput="filterTable('inq',this.value)"/>
            <button class="refresh-btn" onclick="loadAll()">↻ Refresh</button>
            <button class="export-btn" onclick="exportCSV('inquiries')">⬇ Export CSV</button>
          </div>
        </div>
        <div id="inq-body">
          <div class="loading">Loading inquiries…</div>
        </div>
        <div class="pagination" id="inq-pg"></div>
      </div>
    </div>

    <!-- Listings Panel -->
    <div id="panel-listings" class="panel-section">
      <div class="table-wrap">
        <div class="tw-header">
          <div class="tw-title">Business Listings</div>
          <div class="tw-actions">
            <input class="search-input" type="text" placeholder="Search company, location…" oninput="filterTable('lst',this.value)"/>
            <button class="refresh-btn" onclick="loadAll()">↻ Refresh</button>
            <button class="export-btn" onclick="exportCSV('listings')">⬇ Export CSV</button>
          </div>
        </div>
        <div id="lst-body">
          <div class="loading">Loading listings…</div>
        </div>
        <div class="pagination" id="lst-pg"></div>
      </div>
    </div>
  </div>
</div>

<script src="./admin-config.local.js"></script>
<script>
/* ── CONFIG ── same values as landing pages ── */
const SB_URL     = 'https://iteaawedfmaujujyrqdu.supabase.co';
const SB_ANON    = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0ZWFhd2VkZm1hdWp1anlycWR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NDcxMjMsImV4cCI6MjA5MjAyMzEyM30.13zzs_qkn51wMm-ZC84FhruuLtPlYLpuDdJvMj8AP-Y';
/* ── SECRETS ARE NOT SOURCE ────────────────────────────────────────
   A service_role key bypasses row-level security entirely: whoever holds
   it can read or delete the whole database. It was committed here in
   plain text, which put it in git history forever. It now loads from
   admin-config.local.js — a file that is gitignored and never deployed.
   Create it from admin-config.example.js and paste the CURRENT key in.
   If the file is absent, admin reads simply fail; nothing silently
   falls back to a weaker credential. */
const SB_SERVICE = (window.ADMIN_CONFIG && window.ADMIN_CONFIG.serviceKey) || '';
const ADMIN_PASS = (window.ADMIN_CONFIG && window.ADMIN_CONFIG.adminPass) || '';

/* ── AUTH ── */
function doLogin(){
  const p = document.getElementById('adminPass').value;
  if(p === ADMIN_PASS){
    sessionStorage.setItem('dm_admin','1');
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('dashboard').style.display='block';
    loadAll();
  } else {
    document.getElementById('loginErr').style.display='block';
  }
}
function doLogout(){
  sessionStorage.removeItem('dm_admin');
  location.reload();
}
if(sessionStorage.getItem('dm_admin')==='1'){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('dashboard').style.display='block';
}

/* ── DATA ── */
let allInquiries=[], allListings=[], inqPage=1, lstPage=1;
const PAGE_SIZE=15;

async function sbFetch(table){
  const r = await fetch(`${SB_URL}/rest/v1/${table}?order=created_at.desc&limit=1000`,{
    headers:{'apikey':SB_SERVICE,'Authorization':'Bearer '+SB_SERVICE}
  });
  if(!r.ok) throw new Error('Fetch failed');
  return r.json();
}

async function loadAll(){
  try{
    [allInquiries, allListings] = await Promise.all([
      sbFetch('contact_inquiries'),
      sbFetch('business_listings')
    ]);
    updateStats();
    renderInquiries(allInquiries, inqPage);
    renderListings(allListings, lstPage);
  } catch(e){
    document.getElementById('inq-body').innerHTML='<div class="empty-state"><div class="es-icon">⚠️</div><p>Failed to load. Check Supabase config.</p></div>';
    document.getElementById('lst-body').innerHTML='<div class="empty-state"><div class="es-icon">⚠️</div><p>Failed to load. Check Supabase config.</p></div>';
  }
}

function updateStats(){
  document.getElementById('st-inquiries').textContent = allInquiries.length;
  document.getElementById('st-listings').textContent  = allListings.length;
  const today = new Date().toISOString().slice(0,10);
  const todayCount = [...allInquiries,...allListings].filter(r=>r.created_at&&r.created_at.startsWith(today)).length;
  document.getElementById('st-today').textContent = todayCount;
}

function fmtDate(iso){
  if(!iso) return '—';
  const d=new Date(iso);
  return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}
function srcBadge(s){
  if(!s) return '';
  if(s.includes('Hindi')) return '<span class="badge badge-hi">HI</span>';
  return '<span class="badge badge-en">EN</span>';
}
function esc(v){return (v||'—').toString().replace(/</g,'&lt;');}

function renderInquiries(data, page){
  const start=(page-1)*PAGE_SIZE, slice=data.slice(start,start+PAGE_SIZE);
  if(!data.length){
    document.getElementById('inq-body').innerHTML='<div class="empty-state"><div class="es-icon">📭</div><p>No inquiries yet.</p></div>';
    document.getElementById('inq-pg').innerHTML=''; return;
  }
  let html='<table><thead><tr><th>#</th><th>Name</th><th>Phone / Email</th><th>Role</th><th>Company</th><th>Message</th><th>Source</th><th>Date</th></tr></thead><tbody>';
  slice.forEach((r,i)=>{
    html+=`<tr>
      <td style="color:var(--muted);font-size:.75rem;">${start+i+1}</td>
      <td class="td-name">${esc(r.name)}</td>
      <td class="td-phone"><a href="tel:${esc(r.phone)}">${esc(r.phone)}</a><br/><span style="color:var(--muted);font-size:.75rem;">${esc(r.email)}</span></td>
      <td><span style="font-size:.78rem;">${esc(r.role)}</span></td>
      <td>${esc(r.company)}</td>
      <td style="max-width:200px;font-size:.78rem;color:var(--muted);">${esc((r.message||'').slice(0,80))}${(r.message||'').length>80?'…':''}</td>
      <td>${srcBadge(r.source)}</td>
      <td class="td-time">${fmtDate(r.created_at)}</td>
    </tr>`;
  });
  html+='</tbody></table>';
  document.getElementById('inq-body').innerHTML=html;
  renderPagination('inq-pg', data.length, page, (p)=>{inqPage=p;renderInquiries(data,p);});
}

function renderListings(data, page){
  const start=(page-1)*PAGE_SIZE, slice=data.slice(start,start+PAGE_SIZE);
  if(!data.length){
    document.getElementById('lst-body').innerHTML='<div class="empty-state"><div class="es-icon">🏭</div><p>No listings yet.</p></div>';
    document.getElementById('lst-pg').innerHTML=''; return;
  }
  let html='<table><thead><tr><th>#</th><th>Company</th><th>Contact Person</th><th>Phone / Email</th><th>Product</th><th>Location</th><th>Capacity</th><th>Source</th><th>Date</th></tr></thead><tbody>';
  slice.forEach((r,i)=>{
    html+=`<tr>
      <td style="color:var(--muted);font-size:.75rem;">${start+i+1}</td>
      <td class="td-name">${esc(r.company_name)}</td>
      <td>${esc(r.contact_person)}</td>
      <td class="td-phone"><a href="tel:${esc(r.phone)}">${esc(r.phone)}</a><br/><span style="color:var(--muted);font-size:.75rem;">${esc(r.email)}</span></td>
      <td><span class="badge badge-product">${esc(r.product_type)}</span></td>
      <td>${esc(r.location)}</td>
      <td style="font-size:.78rem;">${esc(r.capacity)}</td>
      <td>${srcBadge(r.source)}</td>
      <td class="td-time">${fmtDate(r.created_at)}</td>
    </tr>`;
  });
  html+='</tbody></table>';
  document.getElementById('lst-body').innerHTML=html;
  renderPagination('lst-pg', data.length, page, (p)=>{lstPage=p;renderListings(data,p);});
}

function renderPagination(id, total, current, cb){
  const pages=Math.ceil(total/PAGE_SIZE);
  if(pages<=1){document.getElementById(id).innerHTML='';return;}
  document.getElementById(id).innerHTML=`
    <span class="pg-info">Showing ${Math.min((current-1)*PAGE_SIZE+1,total)}–${Math.min(current*PAGE_SIZE,total)} of ${total}</span>
    <div class="pg-btns">
      <button class="pg-btn" ${current===1?'disabled':''} onclick="(${cb.toString()})(${current-1})">← Prev</button>
      <button class="pg-btn" ${current===pages?'disabled':''} onclick="(${cb.toString()})(${current+1})">Next →</button>
    </div>`;
}

/* ── SEARCH ── */
function filterTable(type, q){
  q=q.toLowerCase();
  if(type==='inq'){
    const f=allInquiries.filter(r=>(r.name||'').toLowerCase().includes(q)||(r.phone||'').includes(q)||(r.company||'').toLowerCase().includes(q)||(r.email||'').toLowerCase().includes(q));
    inqPage=1; renderInquiries(f,1);
  } else {
    const f=allListings.filter(r=>(r.company_name||'').toLowerCase().includes(q)||(r.phone||'').includes(q)||(r.location||'').toLowerCase().includes(q)||(r.contact_person||'').toLowerCase().includes(q));
    lstPage=1; renderListings(f,1);
  }
}

/* ── EXPORT CSV ── */
function exportCSV(type){
  const isInq=(type==='inquiries');
  const data=isInq?allInquiries:allListings;
  if(!data.length){alert('No data to export.');return;}
  const headers=isInq
    ?['ID','Name','Phone','Email','Role','Company','Message','Source','Date']
    :['ID','Company Name','Contact Person','Phone','Email','Product Type','Location','Capacity','Message','Source','Date'];
  const rows=data.map((r,i)=> isInq
    ?[i+1,r.name,r.phone,r.email,r.role,r.company,(r.message||'').replace(/,/g,';'),r.source,fmtDate(r.created_at)]
    :[i+1,r.company_name,r.contact_person,r.phone,r.email,r.product_type,r.location,r.capacity,(r.message||'').replace(/,/g,';'),r.source,fmtDate(r.created_at)]
  );
  const csv=[headers,...rows].map(r=>r.map(v=>`"${(v||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`deshwali_${type}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

/* ── TAB SWITCH ── */
function switchTab(name, el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel-section').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-'+name).classList.add('active');
}

/* Auto-load if already logged in */
if(sessionStorage.getItem('dm_admin')==='1') loadAll();
</script>
