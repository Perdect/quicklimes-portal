name: 🚀 Deploy QuickLimes to Hostinger

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build deploy tree
        run: |
          set -e
          mkdir -p deploy

          # ── ROOT (quicklimes.com) ──
          # Marketing site + signup + login + legal pages + assets
          cp index.html              deploy/index.html
          cp signup.html             deploy/signup.html
          cp privacy_policy.html     deploy/privacy_policy.html
          cp terms_and_conditions.html deploy/terms_and_conditions.html
          cp quicklime.html          deploy/quicklime.html
          cp quicklimes-admin.html   deploy/quicklimes-admin.html
          # Pre-redesign page, archived (noindex) — instant rollback at /old
          cp index-old.html          deploy/index-old.html
          # Backend shim so the ROOT login/signup pages talk to the Hostinger
          # PHP API (window.supabase drop-in). Single source: dashboard/v2/ql-api.js.
          cp dashboard/v2/ql-api.js  deploy/ql-api.js
          # Hindi marketing page (rewritten from /hi if .htaccess routes it)
          cp deshwali_minerals_hindi.html deploy/deshwali_minerals_hindi.html
          # Branded 404 + crawler discovery
          cp 404.html                deploy/404.html
          cp sitemap.xml             deploy/sitemap.xml
          cp robots.txt              deploy/robots.txt
          # Favicon at site root so the browser tab and link previews resolve it
          cp icon.svg                deploy/icon.svg
          cp site.webmanifest        deploy/site.webmanifest
          cp .htaccess               deploy/.htaccess
          cp -r assets               deploy/assets

          # ── APP SUBDOMAIN (app.quicklimes.com) ──
          # CUTOVER: v2 is now the default app. The root forwards into /v2/
          # (preserving the #auth= login hash); the original v1 dashboard
          # stays available as a backup at /classic.html.
          mkdir -p deploy/app
          cp dashboard/v2-redirect.html   deploy/app/index.html     # / → /v2/dashboard.html
          cp dashboard/index.html         deploy/app/classic.html   # v1 backup
          cp dashboard/manifest.json      deploy/app/manifest.json
          cp dashboard/icon.svg           deploy/app/icon.svg
          cp dashboard/quick-limes-logo.png deploy/app/quick-limes-logo.png
          # SPA fallback — any non-file path → index.html (now the v2 redirect)
          cp dashboard/.htaccess          deploy/app/.htaccess
          cp dashboard/robots.txt         deploy/app/robots.txt
          cp -r "dashboard/Deshwali Minerals — Business Suite_files" deploy/app/
          # v2 redesign — multi-page app at app.quicklimes.com/v2/ (and now the default).
          # Real .html files, so the SPA fallback above won't intercept them.
          cp -r dashboard/v2              deploy/app/v2
          # PHP API (backend migration off Supabase → Hostinger MySQL).
          # Copy the whole folder (php + .htaccess + schema.sql) but NOT
          # config.php — that holds the DB password and lives ONLY on the
          # server (it's git-ignored, never in the checkout, and the deploy
          # runs with clean-slate off so it is never overwritten).
          mkdir -p deploy/app/api
          cp -a dashboard/api/.           deploy/app/api/ 2>/dev/null || true
          rm -f deploy/app/api/config.php
          # One-time migration tool (localStorage → MySQL), served on the app subdomain.
          cp dashboard/migrate.html       deploy/app/migrate.html
          # Make the brand logo also accessible inside /app for any header reuse
          cp -r assets deploy/app/assets
          cp site.webmanifest deploy/app/site.webmanifest

          # ── ADMIN SUBDOMAIN (admin.quicklimes.com) ──
          # Admin login → redirects to dashboard on success
          mkdir -p deploy/admin
          cp quicklimes-admin.html deploy/admin/index.html
          cp -r assets             deploy/admin/assets

          echo "── deploy tree ──"
          find deploy -maxdepth 3 -type f | sort


      # ── SPLIT: assets first, HTML last ─────────────────────────────────
      # Hostinger intermittently times out the FTPS control socket for
      # GitHub-runner IPs. A retry lands (every failure this far has been
      # transient), but a sync that dies PART-WAY is the real hazard: on
      # 2026-07-15 new HTML referencing qlx.css?v=m6 went up while the CSS
      # itself did not, so browsers cached that URL with the OLD file body and
      # kept the stale asset even after the rerun fixed the server.
      #
      # Uploading assets BEFORE HTML removes that window entirely: if a sync
      # dies, the live (old) HTML still points at assets that exist, and new
      # assets sit unreferenced and harmless. HTML — the only thing that
      # switches users onto the new versions — goes last.
      - name: ✂️ Split tree (assets vs html)
        run: |
          set -e
          mkdir -p deploy_html
          (cd deploy && find . -name '*.html' -print0 | rsync -a --files-from=- --from0 ./ ../deploy_html/)
          find deploy -name '*.html' -delete
          echo "assets: $(find deploy -type f | wc -l) files · html: $(find deploy_html -type f | wc -l) files"

      # ── PHASE 1: assets (js / css / php / images) ──
      - name: 📦 Assets → Hostinger (attempt 1)
        id: a1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST != '' && secrets.FTP_HOST || '62.72.28.240' }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 60000
          local-dir: ./deploy/
          server-dir: /
          state-name: .ftp-deploy-assets.json
          log-level: minimal
          dangerous-clean-slate: false
      - name: ⏲️ Cool down
        if: steps.a1.outcome == 'failure'
        run: sleep 45
      - name: 📦 Assets → Hostinger (attempt 2 — final)
        id: a2
        if: steps.a1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST != '' && secrets.FTP_HOST || '62.72.28.240' }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 60000
          local-dir: ./deploy/
          server-dir: /
          state-name: .ftp-deploy-assets.json
          log-level: minimal
          dangerous-clean-slate: false

      # ── PHASE 2: HTML (flips users onto the new asset versions) ──
      - name: 📄 HTML → Hostinger (attempt 1)
        id: h1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST != '' && secrets.FTP_HOST || '62.72.28.240' }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 60000
          local-dir: ./deploy_html/
          server-dir: /
          state-name: .ftp-deploy-html.json
          log-level: minimal
          dangerous-clean-slate: false
      - name: ⏲️ Cool down
        if: steps.h1.outcome == 'failure'
        run: sleep 45
      - name: 📄 HTML → Hostinger (attempt 2 — final)
        id: h2
        if: steps.h1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST != '' && secrets.FTP_HOST || '62.72.28.240' }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 60000
          local-dir: ./deploy_html/
          server-dir: /
          state-name: .ftp-deploy-html.json
          log-level: minimal
          dangerous-clean-slate: false

      # ── VERIFY: the live site must be self-consistent ──────────────────
      # Reads the LIVE html and checks that every versioned asset it asks for
      # actually resolves. Turns a silent half-deploy into a red build.
      - name: ✅ Verify the live site
        run: bash scripts/verify-deploy.sh
