name: 🚀 Deploy QuickLimes to Hostinger

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build deploy tree
        run: |
          set -e
          mkdir -p deploy

          # ── ROOT (quicklimes.com) ──
          # Marketing site + signup + login + legal pages + assets
          cp index.html              deploy/index.html
          cp signup.html             deploy/signup.html
          cp privacy_policy.html     deploy/privacy_policy.html
          cp terms_and_conditions.html deploy/terms_and_conditions.html
          cp quicklime.html          deploy/quicklime.html
          cp quicklimes-admin.html   deploy/quicklimes-admin.html
          # Hindi marketing page (rewritten from /hi if .htaccess routes it)
          cp deshwali_minerals_hindi.html deploy/deshwali_minerals_hindi.html
          # Favicon at site root so the browser tab and link previews resolve it
          cp icon.svg                deploy/icon.svg
          cp .htaccess               deploy/.htaccess
          cp -r assets               deploy/assets

          # ── APP SUBDOMAIN (app.quicklimes.com) ──
          # The dashboard
          mkdir -p deploy/app
          cp dashboard/index.html         deploy/app/index.html
          cp dashboard/manifest.json      deploy/app/manifest.json
          cp dashboard/icon.svg           deploy/app/icon.svg
          cp dashboard/quick-limes-logo.png deploy/app/quick-limes-logo.png
          cp -r "dashboard/Deshwali Minerals — Business Suite_files" deploy/app/
          # Make the brand logo also accessible inside /app for any header reuse
          cp -r assets deploy/app/assets

          # ── ADMIN SUBDOMAIN (admin.quicklimes.com) ──
          # Admin login → redirects to dashboard on success
          mkdir -p deploy/admin
          cp quicklimes-admin.html deploy/admin/index.html
          cp -r assets             deploy/admin/assets

          echo "── deploy tree ──"
          find deploy -maxdepth 3 -type f | sort

      - name: 🚀 Sync deploy/ to Hostinger via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # Prefer a hostname secret (FTP_HOST) so we survive IP changes;
          # fall back to the known Hostinger IP if the secret isn't set yet.
          server: ${{ secrets.FTP_HOST != '' && secrets.FTP_HOST || '62.72.28.240' }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 60000
          local-dir: ./deploy/
          server-dir: /
          state-name: .ftp-deploy-sync-state.json
          log-level: minimal
          # Don't delete other files on the server (keeps anything outside deploy/)
          dangerous-clean-slate: false
