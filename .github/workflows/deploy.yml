name: 🚀 Deploy QuickLimes to Hostinger

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build deploy folders
        run: |
          mkdir -p deploy/app deploy/admin deploy/root
          cp quicklime.html deploy/app/index.html
          cp quicklimes-admin.html deploy/admin/index.html
          cp quicklimes-landing.html deploy/root/index.html

      - name: 🚀 Upload all files via FTP
        run: |
          curl -T deploy/root/index.html \
            "ftp://62.72.28.240/index.html" \
            -u "$FTP_USER:$FTP_PASS" --ftp-create-dirs --ssl-reqd --insecure

          curl -T deploy/app/index.html \
            "ftp://62.72.28.240/app/index.html" \
            -u "$FTP_USER:$FTP_PASS" --ftp-create-dirs --ssl-reqd --insecure

          curl -T deploy/admin/index.html \
            "ftp://62.72.28.240/admin/index.html" \
            -u "$FTP_USER:$FTP_PASS" --ftp-create-dirs --ssl-reqd --insecure
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
