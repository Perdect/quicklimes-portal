name: 🚀 Deploy QuickLimes to Hostinger

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build deploy tree
        run: |
          set -e
          mkdir -p deploy

          # ── ROOT (quicklimes.com) ──
          # Marketing site + signup + login + legal pages + assets
          cp index.html              deploy/index.html
          cp signup.html             deploy/signup.html
          cp privacy_policy.html     deploy/privacy_policy.html
          cp terms_and_conditions.html deploy/terms_and_conditions.html
          cp quicklime.html          deploy/quicklime.html
          cp quicklimes-admin.html   deploy/quicklimes-admin.html
          # Hindi marketing page (rewritten from /hi if .htaccess routes it)
          cp deshwali_minerals_hindi.html deploy/deshwali_minerals_hindi.html
          # Branded 404 + crawler discovery
          cp 404.html                deploy/404.html
          cp sitemap.xml             deploy/sitemap.xml
          cp robots.txt              deploy/robots.txt
          # Favicon at site root so the browser tab and link previews resolve it
          cp icon.svg                deploy/icon.svg
          cp .htaccess               deploy/.htaccess
          cp -r assets               deploy/assets

          # ── APP SUBDOMAIN (app.quicklimes.com) ──
          # CUTOVER: v2 is now the default app. The root forwards into /v2/
          # (preserving the #auth= login hash); the original v1 dashboard
          # stays available as a backup at /classic.html.
          mkdir -p deploy/app
          cp dashboard/v2-redirect.html   deploy/app/index.html     # / → /v2/dashboard.html
          cp dashboard/index.html         deploy/app/classic.html   # v1 backup
          cp dashboard/manifest.json      deploy/app/manifest.json
          cp dashboard/icon.svg           deploy/app/icon.svg
          cp dashboard/quick-limes-logo.png deploy/app/quick-limes-logo.png
          # SPA fallback — any non-file path → index.html (now the v2 redirect)
          cp dashboard/.htaccess          deploy/app/.htaccess
          cp -r "dashboard/Deshwali Minerals — Business Suite_files" deploy/app/
          # v2 redesign — multi-page app at app.quicklimes.com/v2/ (and now the default).
          # Real .html files, so the SPA fallback above won't intercept them.
          cp -r dashboard/v2              deploy/app/v2
          # Make the brand logo also accessible inside /app for any header reuse
          cp -r assets deploy/app/assets

          # ── ADMIN SUBDOMAIN (admin.quicklimes.com) ──
          # Admin login → redirects to dashboard on success
          mkdir -p deploy/admin
          cp quicklimes-admin.html deploy/admin/index.html
          cp -r assets             deploy/admin/assets

          echo "── deploy tree ──"
          find deploy -maxdepth 3 -type f | sort

      # Hostinger intermittently times out the FTPS control socket for
      # GitHub-runner IPs (seen 2026-05-09 and 2026-06-12). The host itself
      # stays reachable, so a second attempt after a cool-down almost always
      # lands. Attempt 1 is allowed to fail; attempt 2 only runs if needed.
      - name: 🚀 Sync deploy/ to Hostinger via FTPS (attempt 1)
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # Prefer a hostname secret (FTP_HOST) so we survive IP changes;
          # fall back to the known Hostinger IP if the secret isn't set yet.
          server: ${{ secrets.FTP_HOST != '' && secrets.FTP_HOST || '62.72.28.240' }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 120000
          local-dir: ./deploy/
          server-dir: /
          state-name: .ftp-deploy-sync-state.json
          log-level: minimal
          # Don't delete other files on the server (keeps anything outside deploy/)
          dangerous-clean-slate: false

      - name: ⏲️ Cool down before retry
        if: steps.ftp1.outcome == 'failure'
        run: sleep 60

      - name: 🚀 Sync deploy/ to Hostinger via FTPS (attempt 2)
        if: steps.ftp1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST != '' && secrets.FTP_HOST || '62.72.28.240' }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 120000
          local-dir: ./deploy/
          server-dir: /
          state-name: .ftp-deploy-sync-state.json
          log-level: minimal
          dangerous-clean-slate: false
